<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>BD Islamic Messenger</title>
<style>
:root{--green:#075e54;--green2:#128c7e;--mint:#e7f5ef;--bg:#f3f8f5;--white:#fff;--text:#17251f;--muted:#718078;--line:#dfe9e4;--danger:#d93025;--bubble:#dcf8c6;--blue:#4b7bec;--shadow:0 8px 28px rgba(20,55,40,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;max-width:720px;margin:auto;background:var(--bg)}
.top{height:64px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 7px #0002}.top h2{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iconBtn{width:42px;height:42px;border:0;background:transparent;color:#fff;border-radius:50%;font-size:22px}.iconBtn:active{background:#ffffff22}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#eaf7f0,#f8fbf9)}.authCard{width:min(470px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:var(--shadow)}.logo{width:82px;height:82px;border-radius:26px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:42px;margin:auto;box-shadow:0 10px 25px #075e5430}.auth h1{text-align:center;color:var(--green);font-size:25px;margin:16px 0 5px}.sub{text-align:center;color:var(--muted);margin:0 0 22px}.tabs{display:flex;gap:8px;background:#edf6f1;padding:5px;border-radius:15px;margin-bottom:16px}.tab{flex:1;border:0;border-radius:11px;padding:11px;background:transparent;color:var(--green);font-weight:700}.tab.active{background:var(--green);color:#fff}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;color:#52635a;margin-bottom:7px}.input,.select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc;outline:0;color:var(--text)}.input:focus,.select:focus{border-color:var(--green2);box-shadow:0 0 0 3px #128c7e18}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:var(--green2);color:#fff;font-weight:800;margin-top:8px}.secondary{width:100%;border:1px solid #b9d9ce;border-radius:14px;padding:13px;background:#f1f8f4;color:var(--green);font-weight:800;margin-top:9px}.danger{background:var(--danger)!important;color:#fff!important;border-color:var(--danger)!important}.note{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;margin-top:12px}
.searchBar{padding:9px;background:#edf7f2;border-bottom:1px solid var(--line)}.searchBar .input{padding:11px 13px;background:#fff}.homeHeader{padding:18px 16px 10px}.meCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:13px;box-shadow:0 3px 14px #00000006}.avatar{width:54px;height:54px;border-radius:50%;background:#d7efe4;color:var(--green);display:grid;place-items:center;font-size:22px;font-weight:800;overflow:hidden;flex:none;position:relative}.avatar img{width:100%;height:100%;object-fit:cover}.presence{position:absolute;width:13px;height:13px;border-radius:50%;right:0;bottom:1px;border:2px solid #fff;background:#aab4af}.presence.on{background:#25d366}.meInfo{min-width:0;flex:1}.meName{font-size:17px;font-weight:800}.meCode{font-size:12px;color:var(--muted);margin-top:2px}.homeActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}.action{border:0;border-radius:15px;padding:13px;background:var(--mint);color:var(--green);font-weight:800}.sectionTitle{padding:14px 16px 8px;font-size:18px;font-weight:900}.chatList{padding-bottom:86px}.chatRow{display:flex;gap:12px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #edf2ef}.chatRow:active{background:#eef8f3}.chatMain{min-width:0;flex:1}.chatName{font-weight:800;display:flex;align-items:center;gap:5px}.chatLast{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chatMeta{text-align:right;font-size:11px;color:var(--muted)}.unread{background:var(--green2);color:#fff;min-width:21px;height:21px;padding:0 6px;border-radius:11px;display:inline-grid;place-items:center;font-size:11px;font-weight:900;margin-top:5px}.bold{font-weight:900;color:var(--text)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);height:70px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25}.nav{flex:1;border:0;background:#fff;color:#7b8983;font-size:12px;font-weight:700}.nav.active{color:var(--green2)}.nav span{font-size:23px;display:block;line-height:25px}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:82px;width:55px;height:55px;border:0;border-radius:50%;background:var(--green2);color:#fff;font-size:28px;box-shadow:0 8px 22px #075e5440;z-index:24}
.pagePad{padding-bottom:86px}.settingsCard,.profilePage{background:#fff;margin:14px 16px;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.settingRow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf2ef}.settingRow:last-child{border-bottom:0}.settingIcon{width:42px;height:42px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:20px}.settingMain{flex:1}.settingTitle{font-weight:800}.settingSub{font-size:12px;color:var(--muted);margin-top:3px}
.chatPage{height:100vh;display:flex;flex-direction:column;background:#e8f3ed}.chatTop{position:sticky;top:0;z-index:20;height:64px;background:var(--green);color:#fff;display:flex;align-items:center;gap:9px;padding:0 8px}.chatTop .title{min-width:0;flex:1}.chatTop .title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatTop .title small{display:block;color:#d7eee8;font-size:11px;margin-top:2px}.messages{flex:1;overflow:auto;padding:14px 10px 12px;background-color:#e8f3ed;background-image:radial-gradient(#b7d7ca 1px,transparent 1px);background-size:18px 18px}.bubbleWrap{display:flex;margin:4px 0}.bubbleWrap.mine{justify-content:flex-end}.bubble{max-width:82%;background:#fff;border-radius:15px;padding:7px 9px 5px;box-shadow:0 1px 2px #00000012;overflow:hidden}.bubble.mine{background:var(--bubble);border-top-right-radius:4px}.bubble.them{border-top-left-radius:4px}.bubble img,.bubble video{display:block;max-width:100%;max-height:310px;border-radius:11px;object-fit:cover;background:#e9efec}.bubble video{width:100%;min-height:100px}.bubbleText{font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.metaLine{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-top:3px;color:#718078;font-size:9px}.ticks{font-size:13px;color:#718078;letter-spacing:-3px}.ticks.seen{color:#1686e5}.mediaError{padding:16px;text-align:center;color:#718078;font-size:12px;background:#eef3f0;border-radius:11px}.composer{display:flex;align-items:flex-end;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--line)}.attach{width:44px;height:44px;border:0;border-radius:50%;background:#eff7f2;color:var(--green2);font-size:22px}.composer .input{flex:1;border-radius:23px;padding:12px 15px;max-height:120px}.send{width:46px;height:46px;border:0;border-radius:50%;background:var(--green2);color:#fff;font-size:20px}.chatMenu{position:absolute;right:8px;top:58px;background:#fff;color:var(--text);border-radius:15px;box-shadow:0 10px 30px #0003;overflow:hidden;min-width:190px;z-index:30}.chatMenu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:13px 15px}.chatMenu button:hover{background:#f2f7f4}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(720px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px #0003}.sheet.center{align-self:center;border-radius:24px;max-height:85vh;margin:16px}.sheetTitle{display:flex;align-items:center;gap:10px}.sheetTitle h3{margin:0;flex:1;font-size:20px}.close{border:0;background:#edf6f1;color:var(--green);width:38px;height:38px;border-radius:50%;font-size:20px}.profileHero{text-align:center;padding:4px 0 14px}.profileAvatar{width:105px;height:105px;border-radius:50%;margin:0 auto 12px;background:#d7efe4;color:var(--green);display:grid;place-items:center;font-size:38px;font-weight:900;overflow:hidden}.profileAvatar img{width:100%;height:100%;object-fit:cover}.profileName{font-size:21px;font-weight:900}.profileCode{color:var(--muted);font-size:13px;margin-top:3px}.profileActions{display:grid;gap:9px;margin-top:15px}.preview{width:100%;max-height:280px;object-fit:contain;border-radius:15px;background:#eef4f1;margin-top:10px}.accountItem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.accountItem:last-child{border-bottom:0}.accountItem .main{flex:1;min-width:0}.accountItem b{display:block}.accountItem small{color:var(--muted)}.smallBtn{border:0;border-radius:10px;padding:9px 12px;background:var(--mint);color:var(--green);font-weight:800}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#17322a;color:#fff;padding:10px 15px;border-radius:20px;z-index:100;max-width:90%;text-align:center;font-size:13px;box-shadow:0 6px 20px #0003}.empty{text-align:center;color:var(--muted);padding:45px 20px}.loader{text-align:center;padding:35px;color:var(--muted)}
@media(min-width:721px){body{background:#dce8e2}.app{min-height:100vh;box-shadow:0 0 35px #0001}.auth{min-height:100vh}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>String(s||'?').trim().slice(0,1).toUpperCase();
let token=localStorage.getItem('bdim_token')||'';
let me=null,friends=[],current=null,currentMessages=[],socket=null,menuOpen=false;
let accounts=JSON.parse(localStorage.getItem('bdim_accounts')||'[]');
let activeTab='chats';
const saveAccounts=()=>localStorage.setItem('bdim_accounts',JSON.stringify(accounts.slice(0,8)));
const avatarHtml=(u,online=false,big=false)=>`<div class="${big?'profileAvatar':'avatar'}">${u?.avatarUrl?`<img src="${esc(u.avatarUrl)}" onerror="this.parentElement.innerHTML='${initials(u?.name)}'">`:esc(initials(u?.name))}${!big?`<span class="presence ${online?'on':''}"></span>`:''}</div>`;
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function api(url,opt={}){const h=opt.headers||{};if(!(opt.body instanceof FormData))h['Content-Type']='application/json';if(token)h.Authorization='Bearer '+token;const r=await fetch(url,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'সার্ভার সমস্যা');return d}
function setToken(t){token=t;localStorage.setItem('bdim_token',t)}
function rememberAccount(u,t){accounts=accounts.filter(a=>a.phone!==u.phone);accounts.unshift({id:u.id,name:u.name,phone:u.phone,code:u.code,avatarUrl:u.avatarUrl||'',token:t});saveAccounts()}
function authScreen(mode='login'){
  $('root').innerHTML=`<div class="auth"><div class="authCard"><div class="logo">☪</div><h1>BD Islamic Messenger</h1><p class="sub">ইসলামিকভাবে সুন্দর ও নিরাপদে সংযুক্ত থাকুন</p><div class="tabs"><button id="tabLogin" class="tab ${mode==='login'?'active':''}" onclick="authScreen('login')">লগইন</button><button id="tabReg" class="tab ${mode==='register'?'active':''}" onclick="authScreen('register')">নতুন অ্যাকাউন্ট</button></div><div id="authBox"></div></div></div>`;
  $('authBox').innerHTML=mode==='login'?`<div class="field"><label>ফোন নম্বর</label><input id="loginPhone" class="input" inputmode="tel" placeholder="01XXXXXXXXX"></div><div class="field"><label>৪ সংখ্যার User Code / PIN</label><input id="loginPin" class="input" inputmode="numeric" maxlength="4" placeholder="1234"></div><button class="primary" onclick="login()">লগইন করুন</button>${accounts.length?`<button class="secondary" onclick="accountPicker()">এই ফোনে থাকা অ্যাকাউন্ট</button>`:''}<p class="note">OTP লাগবে না। আপনার ফোন নম্বর ও ৪ সংখ্যার কোড দিয়ে প্রবেশ করুন।</p>`:`<div class="field"><label>আপনার নাম</label><input id="regName" class="input" placeholder="নাম লিখুন"></div><div class="field"><label>ফোন নম্বর</label><input id="regPhone" class="input" inputmode="tel" placeholder="01XXXXXXXXX"></div><div class="field"><label>৪ সংখ্যার User Code / PIN</label><input id="regPin" class="input" inputmode="numeric" maxlength="4" placeholder="যেমন 2580"></div><button class="primary" onclick="register()">অ্যাকাউন্ট তৈরি করুন</button><p class="note">একটি ফোন নম্বর দিয়ে একটি অ্যাকাউন্ট। একই ফোনে পরে একাধিক অ্যাকাউন্ট সংরক্ষণ করে Switch করা যাবে।</p>`;
}
async function login(){try{const phone=$('loginPhone').value.trim(),pin=$('loginPin').value.trim();if(!phone||!/^[0-9]{4}$/.test(pin))throw Error('ফোন নম্বর ও ৪ সংখ্যার কোড দিন');const d=await api('/api/login',{method:'POST',body:JSON.stringify({phone,pin})});setToken(d.token);rememberAccount(d.user,d.token);await start()}catch(e){toast(e.message)}}
async function register(){try{const name=$('regName').value.trim(),phone=$('regPhone').value.trim(),pin=$('regPin').value.trim();if(!name||!phone||!/^[0-9]{4}$/.test(pin))throw Error('নাম, ফোন ও ৪ সংখ্যার কোড দিন');const d=await api('/api/register',{method:'POST',body:JSON.stringify({name,country:'+880',phone,pin})});setToken(d.token);rememberAccount(d.user,d.token);await start()}catch(e){toast(e.message)}}
async function start(){try{me=await api('/api/me');rememberAccount(me,token);await refreshFriends();connectSocket();renderApp()}catch(e){token='';localStorage.removeItem('bdim_token');authScreen('login');toast(e.message)}}
function connectSocket(){if(socket){try{socket.disconnect()}catch{}}socket=io({auth:{token}});socket.on('presence',p=>{const f=friends.find(x=>Number(x.id)===Number(p.userId));if(f){f.online=!!p.online;renderHome()}if(current&&Number(current.id)===Number(p.userId))renderChatHeader()});socket.on('profile:updated',u=>{if(Number(u.id)===Number(me?.id)){me=u;rememberAccount(me,token)}const f=friends.find(x=>Number(x.id)===Number(u.id));if(f)Object.assign(f,u);if(current&&Number(current.id)===Number(u.id))Object.assign(current,u);renderHome()});socket.on('message:new',async m=>{if(current&&Number(m.senderId)===Number(current.id)){currentMessages.push(m);await markRead();renderMessages()}else{const f=friends.find(x=>Number(x.id)===Number(m.senderId));if(f){f.unread=(f.unread||0)+1;f.last=preview(m);f.lastAt=m.createdAt;friends.sort((a,b)=>(b.unread>0)-(a.unread>0)||(new Date(b.lastAt||0)-new Date(a.lastAt||0)));renderHome()} } });socket.on('message:sent',m=>{if(current&&Number(m.receiverId)===Number(current.id)){if(!currentMessages.some(x=>Number(x.id)===Number(m.id)))currentMessages.push(m);renderMessages()}});socket.on('message:read',p=>{const m=currentMessages.find(x=>Number(x.id)===Number(p.id));if(m){m.seen=true;renderMessages()}})}
async function refreshFriends(){friends=await api('/api/friends');const jobs=friends.map(async f=>{try{const ms=await api('/api/chats/'+encodeURIComponent(f.code)+'/messages');f.lastAt=ms.length?ms[ms.length-1].createdAt:'';f.last=ms.length?preview(ms[ms.length-1]):'নতুন বন্ধু';f.unread=ms.filter(m=>Number(m.senderId)===Number(f.id)&&!m.seen).length}catch{}});await Promise.all(jobs);friends.sort((a,b)=>(b.unread>0)-(a.unread>0)||(new Date(b.lastAt||0)-new Date(a.lastAt||0)))}
function renderApp(){document.body.className='';renderHome()}
function renderHome(){
 if(!me)return authScreen('login');
 $('root').innerHTML=`<div class="app"><div id="main"></div><div class="bottom"><button class="nav ${activeTab==='chats'?'active':''}" onclick="switchTab('chats')"><span>💬</span>চ্যাট</button><button class="nav ${activeTab==='friends'?'active':''}" onclick="switchTab('friends')"><span>👥</span>বন্ধু</button><button class="nav ${activeTab==='settings'?'active':''}" onclick="switchTab('settings')"><span>⚙️</span>সেটিংস</button></div></div>`;
 if(activeTab==='chats')homeTab();else if(activeTab==='friends')friendsTab();else settingsTab();
}
function switchTab(t){activeTab=t;renderHome()}
function homeTab(){
 $('main').innerHTML=`<div class="top"><h2>BD Islamic Messenger</h2><button class="iconBtn" onclick="toggleSearch()">⌕</button><button class="iconBtn" onclick="mainMenu()">⋮</button></div><div id="searchWrap" class="searchBar hidden"><input id="searchInput" class="input" placeholder="নাম বা User Code খুঁজুন" oninput="drawChats()"></div><div class="homeHeader"><div class="meCard" onclick="myProfile()">${avatarHtml(me,false)}<div class="meInfo"><div class="meName">${esc(me.name)}</div><div class="meCode">User Code: ${esc(me.code)} · ${esc(me.phone)}</div></div><b style="color:var(--green2)">›</b></div></div><div class="homeActions"><button class="action" onclick="openAddFriend()">＋ Friend যোগ করুন</button><button class="action" onclick="myProfile()">👤 প্রোফাইল</button></div><div class="sectionTitle">আমার Chats</div><div id="chatList" class="chatList"></div><button class="fab" onclick="openAddFriend()">＋</button>`;drawChats()}
function drawChats(){const q=($('searchInput')?.value||'').toLowerCase();const list=friends.filter(f=>(f.name+' '+f.code+' '+(f.last||'')).toLowerCase().includes(q));$('chatList').innerHTML=list.length?list.map(f=>`<div class="chatRow" onclick="openChat('${esc(f.code)}')">${avatarHtml(f,!!f.online)}<div class="chatMain"><div class="chatName ${f.unread?'bold':''}">${esc(f.name)}${f.unread?'<span style="color:var(--green2)">●</span>':''}</div><div class="chatLast ${f.unread?'bold':''}">${esc(f.last||'মেসেজ শুরু করুন')}</div></div><div class="chatMeta">${formatTime(f.lastAt)}${f.unread?`<br><span class="unread">${f.unread}</span>`:''}</div></div>`).join(''):`<div class="empty">এখনও কোনো Chat নেই।<br>＋ Friend যোগ করুন দিয়ে শুরু করুন।</div>`}
function friendsTab(){ $('main').innerHTML=`<div class="top"><h2>আমার Friends</h2><button class="iconBtn" onclick="openAddFriend()">＋</button></div><div id="friendsList" class="chatList"></div>`;$('friendsList').innerHTML=friends.length?friends.map(f=>`<div class="chatRow"><div onclick="openFriendProfile('${esc(f.code)}')">${avatarHtml(f,!!f.online)}</div><div class="chatMain" onclick="openChat('${esc(f.code)}')"><div class="chatName">${esc(f.name)}</div><div class="chatLast">User Code: ${esc(f.code)} · ${f.online?'Online':'Offline'}</div></div><button class="smallBtn" onclick="openFriendProfile('${esc(f.code)}')">প্রোফাইল</button></div>`).join(''):`<div class="empty">এখনও কোনো Friend নেই।</div>`}
function settingsTab(){ $('main').innerHTML=`<div class="top"><h2>Settings</h2><button class="iconBtn" onclick="mainMenu()">⋮</button></div><div class="settingsCard"><div class="profileHero">${avatarHtml(me,false,true)}<div class="profileName">${esc(me.name)}</div><div class="profileCode">User Code: ${esc(me.code)}</div><button class="primary" onclick="myProfile()">আমার প্রোফাইল খুলুন</button></div></div><div class="settingsCard"><div class="settingRow" onclick="accountPicker()"><div class="settingIcon">👥</div><div class="settingMain"><div class="settingTitle">Account Switch</div><div class="settingSub">এই ফোনে থাকা অ্যাকাউন্ট বদলান</div></div><b>›</b></div><div class="settingRow" onclick="openAddFriend()"><div class="settingIcon">➕</div><div class="settingMain"><div class="settingTitle">Friend যোগ করুন</div><div class="settingSub">৪ সংখ্যার User Code দিয়ে</div></div><b>›</b></div><div class="settingRow" onclick="about()"><div class="settingIcon">☪</div><div class="settingMain"><div class="settingTitle">কে বানিয়েছে?</div><div class="settingSub">BD Islamic Messenger</div></div><b>›</b></div><div class="settingRow" onclick="logoutCurrent()"><div class="settingIcon">🚪</div><div class="settingMain"><div class="settingTitle" style="color:var(--danger)">বর্তমান অ্যাকাউন্ট Logout</div></div><b>›</b></div></div><div class="pagePad"></div>`}
function toggleSearch(){const x=$('searchWrap');if(x){x.classList.toggle('hidden');if(!x.classList.contains('hidden'))$('searchInput').focus()}}
function mainMenu(){openSheet(`<div class="sheetTitle"><h3>Menu</h3><button class="close" onclick="closeSheet()">×</button></div><button class="secondary" onclick="closeSheet();switchTab('chats')">🏠 Home</button><button class="secondary" onclick="closeSheet();openAddFriend()">＋ Friend যোগ করুন</button><button class="secondary" onclick="closeSheet();accountPicker()">👥 Account Switch</button><button class="secondary" onclick="closeSheet();myProfile()">👤 Profile</button><button class="primary danger" onclick="closeSheet();logoutCurrent()">Logout</button>`)}
function openChat(code){current=friends.find(f=>String(f.code)===String(code));if(!current)return;renderChat();loadChat()}
function renderChat(){ $('root').innerHTML=`<div class="chatPage"><div class="chatTop"><button class="iconBtn" onclick="closeChat()">‹</button><div onclick="openFriendProfile('${esc(current.code)}')">${avatarHtml(current,!!current.online)}</div><div class="title" onclick="openFriendProfile('${esc(current.code)}')"><b>${esc(current.name)}</b><small>${current.online?'Online':'Offline'} · ${esc(current.code)}</small></div><button class="iconBtn" onclick="toast('ভয়েস কল ফিচার পরের আপডেটে যোগ করা হবে')">☎</button><button class="iconBtn" onclick="openChatMenu()">⋮</button></div><div id="chatMenu" class="chatMenu hidden"><button onclick="closeChatMenu();openFriendProfile('${esc(current.code)}')">👤 প্রোফাইল</button><button onclick="closeChatMenu();openAddFriend()">＋ নতুন Friend</button></div><div id="messages" class="messages"><div class="loader">মেসেজ লোড হচ্ছে…</div></div><div class="composer"><button class="attach" onclick="$('fileInput').click()">📎</button><input id="fileInput" type="file" accept="image/*,video/*" hidden onchange="sendMedia(event)"><textarea id="msgInput" class="input" rows="1" placeholder="মেসেজ লিখুন…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"></textarea><button class="send" onclick="sendText()">➤</button></div></div>`}
async function loadChat(){try{currentMessages=await api('/api/chats/'+encodeURIComponent(current.code)+'/messages');current.unread=0;await markRead();renderMessages()}catch(e){toast(e.message)}}
async function markRead(){try{await api('/api/chats/'+encodeURIComponent(current.code)+'/read',{method:'POST'})}catch{}}
function renderChatHeader(){const t=document.querySelector('.chatTop .title');if(t)t.innerHTML=`<b>${esc(current.name)}</b><small>${current.online?'Online':'Offline'} · ${esc(current.code)}</small>`}
function renderMessages(){const box=$('messages');if(!box)return;box.innerHTML=currentMessages.length?currentMessages.map(m=>messageHtml(m)).join(''):`<div class="empty">এই Chat-এ এখনো কোনো মেসেজ নেই।<br>আসসালামু আলাইকুম দিয়ে শুরু করুন।</div>`;box.scrollTop=box.scrollHeight}
function messageHtml(m){const mine=Number(m.senderId)===Number(me.id);let body='';if(m.type==='image')body=`<img class="preview" src="${esc(m.mediaUrl)}" alt="ছবি" loading="lazy" onerror="this.outerHTML='<div class=mediaError>ছবিটি এখন পাওয়া যাচ্ছে না</div>'">`;else if(m.type==='video')body=`<video class="preview" src="${esc(m.mediaUrl)}" controls playsinline preload="metadata" onerror="this.outerHTML='<div class=mediaError>ভিডিওটি এখন পাওয়া যাচ্ছে না</div>'"></video>`;else body=`<div class="bubbleText">${esc(m.body)}</div>`;return `<div class="bubbleWrap ${mine?'mine':''}"><div class="bubble ${mine?'mine':'them'}">${body}<div class="metaLine">${formatTime(m.createdAt)}${mine?`<span class="ticks ${m.seen?'seen':''}">${m.seen?'✓✓':'✓'}</span>`:''}</div></div></div>`}
function preview(m){if(m.type==='image')return '📷 ছবি';if(m.type==='video')return '🎥 ভিডিও';return m.body||''}
function formatTime(x){if(!x)return '';try{return new Date(x).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'})}catch{return ''}}
async function sendText(){const input=$('msgInput');if(!input)return;const body=input.value.trim();if(!body)return;try{const m=await api('/api/chats/'+encodeURIComponent(current.code)+'/messages',{method:'POST',body:JSON.stringify({type:'text',body})});if(!currentMessages.some(x=>Number(x.id)===Number(m.id)))currentMessages.push(m);input.value='';renderMessages();current.last=body;current.lastAt=m.createdAt;moveFriendTop(current)}catch(e){toast(e.message)}}
async function sendMedia(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>50*1024*1024){toast('সর্বোচ্চ ৫০ MB ফাইল দিন');return}try{const fd=new FormData();fd.append('file',f);const up=await api('/api/upload',{method:'POST',body:fd});const m=await api('/api/chats/'+encodeURIComponent(current.code)+'/messages',{method:'POST',body:JSON.stringify({type:up.type,mediaUrl:up.url})});if(!currentMessages.some(x=>Number(x.id)===Number(m.id)))currentMessages.push(m);renderMessages();current.last=up.type==='image'?'📷 ছবি':'🎥 ভিডিও';current.lastAt=m.createdAt;moveFriendTop(current)}catch(e){toast(e.message)}}
function moveFriendTop(f){friends=friends.filter(x=>Number(x.id)!==Number(f.id));friends.unshift(f);renderHome()}
function closeChat(){current=null;activeTab='chats';renderHome()}
function openChatMenu(){ $('chatMenu')?.classList.toggle('hidden') }function closeChatMenu(){ $('chatMenu')?.classList.add('hidden') }
async function openAddFriend(){openSheet(`<div class="sheetTitle"><h3>বন্ধু যোগ করুন</h3><button class="close" onclick="closeSheet()">×</button></div><p class="sub" style="text-align:left">বন্ধুর ৪ সংখ্যার User Code লিখুন। ভুল কোড হলে কাউকে যোগ করা হবে না।</p><div class="field"><label>User Code</label><input id="friendCode" class="input" inputmode="numeric" maxlength="4" placeholder="যেমন 1234"></div><button class="primary" onclick="findFriend()">Search User</button><div id="foundFriend" style="margin-top:14px"></div>`)}
async function findFriend(){try{const code=$('friendCode').value.trim();if(!/^\d{4}$/.test(code))throw Error('৪ সংখ্যার User Code দিন');const u=await api('/api/users/by-code/'+encodeURIComponent(code));$('foundFriend').innerHTML=`<div class="meCard">${avatarHtml(u,false)}<div class="meInfo"><div class="meName">${esc(u.name)}</div><div class="meCode">User Code: ${esc(u.code)}</div></div></div><button class="primary" onclick="addFriend('${esc(u.code)}')">Friend হিসেবে যোগ করুন</button>`}catch(e){toast(e.message);$('foundFriend').innerHTML=''}}
async function addFriend(code){try{await api('/api/friends/add',{method:'POST',body:JSON.stringify({code})});await refreshFriends();closeSheet();toast('Friend যোগ হয়েছে');renderHome()}catch(e){toast(e.message)}}
async function openFriendProfile(code){try{const u=await api('/api/users/by-code/'+encodeURIComponent(code)+'/profile');openSheet(`<div class="sheetTitle"><h3>প্রোফাইল</h3><button class="close" onclick="closeSheet()">×</button></div><div class="profileHero">${avatarHtml(u,false,true)}<div class="profileName">${esc(u.name)}</div><div class="profileCode">User Code: ${esc(u.code)} · ${u.online?'Online':'Offline'}</div></div><div class="profileActions"><button class="primary" onclick="closeSheet();openChat('${esc(u.code)}')">💬 মেসেজ করুন</button><button class="secondary" onclick="editFriendProfile('${esc(u.code)}')">👤 প্রোফাইল দেখুন</button><button class="${u.blockedByMe?'secondary':'primary danger'}" onclick="toggleBlock('${esc(u.code)}',${u.blockedByMe})">${u.blockedByMe?'🔓 Unblock করুন':'🚫 Block করুন'}</button></div>`)}catch(e){toast(e.message)}}
function editFriendProfile(code){toast('এই প্রোফাইলটি মেসেজ স্ক্রিনের উপরের নামেও খুলতে পারবেন')}
async function toggleBlock(code,isBlocked){try{if(isBlocked)await api('/api/block/'+encodeURIComponent(code),{method:'DELETE'});else await api('/api/block/'+encodeURIComponent(code),{method:'POST'});await refreshFriends();closeSheet();toast(isBlocked?'Unblock করা হয়েছে':'Block করা হয়েছে');renderHome()}catch(e){toast(e.message)}}
async function myProfile(){try{const u=await api('/api/profile');me=u;openSheet(`<div class="sheetTitle"><h3>আমার প্রোফাইল</h3><button class="close" onclick="closeSheet()">×</button></div><div class="profileHero">${avatarHtml(me,false,true)}<div class="profileName">${esc(me.name)}</div><div class="profileCode">User Code: ${esc(me.code)} · ${esc(me.phone)}</div></div><input id="avatarInput" type="file" accept="image/*" hidden onchange="uploadAvatar(event)"><button class="primary" onclick="$('avatarInput').click()">📷 প্রোফাইল ছবি পরিবর্তন করুন</button><div class="field"><label>নাম</label><input id="profileNameInput" class="input" value="${esc(me.name)}"></div><button class="secondary" onclick="saveProfileName()">নাম আপডেট করুন</button><button class="primary danger" onclick="closeSheet();logoutCurrent()">বর্তমান অ্যাকাউন্ট Logout</button>`)}catch(e){toast(e.message)}}
async function uploadAvatar(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>5*1024*1024){toast('প্রোফাইল ছবির সর্বোচ্চ ৫ MB');return}try{const fd=new FormData();fd.append('file',f);const d=await api('/api/profile/avatar',{method:'POST',body:fd});me=d.user;rememberAccount(me,token);closeSheet();toast('প্রোফাইল ছবি আপডেট হয়েছে');renderHome()}catch(e){toast(e.message)}}
async function saveProfileName(){try{const name=$('profileNameInput').value.trim();const u=await api('/api/profile',{method:'POST',body:JSON.stringify({name})});me=u;rememberAccount(me,token);closeSheet();toast('প্রোফাইল আপডেট হয়েছে');renderHome()}catch(e){toast(e.message)}}
function accountPicker(){openSheet(`<div class="sheetTitle"><h3>এই ফোনে থাকা অ্যাকাউন্ট</h3><button class="close" onclick="closeSheet()">×</button></div><div id="accountList"></div><button class="primary" onclick="closeSheet();authScreen('register')">＋ নতুন অ্যাকাউন্ট</button>`);$('accountList').innerHTML=accounts.length?accounts.map((a,i)=>`<div class="accountItem">${avatarHtml(a,false)}<div class="main"><b>${esc(a.name)}</b><small>${esc(a.phone)} · Code ${esc(a.code)}</small></div><button class="smallBtn" onclick="switchAccount(${i})">Switch</button></div>`).join(''):'<div class="empty">এখনো কোনো অ্যাকাউন্ট সংরক্ষিত নেই।</div>'}
async function switchAccount(i){const a=accounts[i];if(!a)return;try{token=a.token;localStorage.setItem('bdim_token',token);closeSheet();await start();toast(a.name+' অ্যাকাউন্ট চালু হয়েছে')}catch(e){toast('এই অ্যাকাউন্টের সেশন শেষ হয়েছে। আবার Login করুন')}}
function logoutCurrent(){accounts=accounts.filter(a=>a.phone!==me.phone);saveAccounts();if(socket)socket.disconnect();token='';localStorage.removeItem('bdim_token');me=null;friends=[];current=null;authScreen('login')}
function about(){openSheet(`<div class="sheetTitle"><h3>BD Islamic Messenger</h3><button class="close" onclick="closeSheet()">×</button></div><div class="profileHero"><div style="font-size:55px">☪️</div><div class="profileName">কে বানিয়েছে?</div><p style="line-height:1.7">আমাকে <b>হাফেজ মহাম্মাদ বাইজিদ বুস্তমি ভাই</b> বানিয়েছেন। চাইলে আপনি তার সাথে যোগাযোগ করতে পারেন।</p><p>📞 <b>01982641237</b></p></div>`)}
function openSheet(html,center=false){let old=$('overlay');if(old)old.remove();const d=document.createElement('div');d.id='overlay';d.className='modal';d.innerHTML=`<div class="sheet ${center?'center':''}">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d)}
function closeSheet(){const x=$('overlay');if(x)x.remove()}
if(token){start()}else{authScreen('login')}
</script>
</body>
</html>
