<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BD Islamic Messenger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef7f0;color:#123;overflow:hidden}
:root{--g:#087443;--g2:#075b35;--red:#c62828;--card:#fff}
button,input,select{font:inherit}button{border:0;cursor:pointer}
.auth{height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#064f30,#0a8b50)}
.card{width:min(430px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 50px #0004}
.logo{width:72px;height:72px;border-radius:50%;background:#087443;color:#fff;display:grid;place-items:center;font-size:34px;margin:auto}
h1{text-align:center;color:var(--g2);margin:10px 0 5px}.sub{text-align:center;color:#687; margin-bottom:18px}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #ccd9d1;border-radius:11px;outline:0}
input:focus,select:focus{border-color:var(--g)}
.primary{width:100%;padding:12px;background:var(--g);color:#fff;border-radius:11px;margin-top:14px;font-weight:bold}
.secondary{width:100%;padding:11px;background:#e9f4ee;color:var(--g2);border-radius:11px;margin-top:8px}
.msg{min-height:20px;text-align:center;color:var(--red);font-size:13px;margin-top:8px}
.app{height:100vh;display:flex;background:#f5faf6}.sidebar{width:360px;max-width:100%;border-right:1px solid #dbe7df;background:#fff;display:flex;flex-direction:column}
.top{background:var(--g);color:#fff;padding:14px;display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:bold}.top .me{flex:1}.top small{opacity:.85}.icon{background:transparent;color:inherit;font-size:21px;padding:6px}
.search{padding:10px}.search input{background:#f1f6f3;border:0}
.list{overflow:auto;flex:1}.row{padding:12px 14px;border-bottom:1px solid #edf2ee;display:flex;gap:11px;align-items:center}.row:hover{background:#f2f8f4}.row .info{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:#718078}.dot{width:10px;height:10px;border-radius:50%;background:#d33;display:inline-block}.dot.on{background:#13a05a}
.empty{text-align:center;padding:45px 20px;color:#718078}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.chathead{padding:12px 16px;background:#fff;border-bottom:1px solid #dbe7df;display:flex;align-items:center;gap:10px}.chathead .info{flex:1}.messages{flex:1;overflow:auto;padding:18px;background:#e9f5ed}.bubble{max-width:min(75%,520px);padding:9px 11px;margin:7px 0;border-radius:14px;position:relative;word-break:break-word}.mine{margin-left:auto;background:#d2f3dd;border-bottom-right-radius:4px}.theirs{background:#fff;border-bottom-left-radius:4px}.time{font-size:10px;color:#718078;margin-top:4px;text-align:right}.composer{background:#fff;padding:9px;display:flex;gap:7px;align-items:center}.composer input{flex:1}.send{background:var(--g);color:#fff;border-radius:50%;width:43px;height:43px}.panel{position:fixed;right:15px;top:62px;width:min(330px,calc(100% - 30px));background:#fff;border-radius:15px;box-shadow:0 10px 35px #0003;padding:15px;z-index:5}.panel h3{margin-top:0}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:18px;z-index:10}.modal .card{max-height:90vh;overflow:auto}
.media{max-width:100%;max-height:260px;border-radius:10px;margin-top:5px}.filebtn{background:#eef6f0;color:var(--g);padding:10px;border-radius:10px}
@media(max-width:700px){.sidebar{width:100%}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.sidebar{border:0}.chathead .back{display:block}.top{padding-top:calc(10px + env(safe-area-inset-top))}}
@media(min-width:701px){.back{display:none!important}}
</style>
</head>
<body>
<div id="auth" class="auth">
 <div class="card">
  <div class="logo">☪</div><h1>BD Islamic Messenger</h1><div class="sub">অনলাইনে বন্ধুদের সাথে নিরাপদে যোগাযোগ</div>
  <div id="registerFields">
   <label>নাম</label><input id="name" placeholder="আপনার নাম">
   <label>দেশ</label><select id="country"><option value="+880">🇧🇩 বাংলাদেশ (+880)</option><option value="+91">🇮🇳 ভারত (+91)</option><option value="+92">🇵🇰 পাকিস্তান (+92)</option><option value="+966">🇸🇦 সৌদি আরব (+966)</option><option value="+971">🇦🇪 UAE (+971)</option><option value="+1">🇺🇸 USA (+1)</option></select>
   <label>ফোন নম্বর</label><input id="phone" inputmode="tel" placeholder="01982641237">
  </div>
  <label>৪ সংখ্যার User Code / PIN</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="1234">
  <button class="primary" onclick="register()">নতুন অ্যাকাউন্ট তৈরি</button>
  <button class="secondary" onclick="login()">নম্বর + PIN দিয়ে লগইন</button>
  <div id="authMsg" class="msg"></div>
  <small style="display:block;text-align:center;color:#789;margin-top:12px">নোট: এই সংস্করণে OTP নেই। ফোন নম্বর + ৪ সংখ্যার PIN দিয়ে লগইন হয়।</small>
 </div>
</div>

<div id="app" class="app hidden">
 <aside class="sidebar">
  <div class="top"><div class="avatar" id="myAvatar">U</div><div class="me"><b id="myName">User</b><small id="myCode"></small></div><button class="icon" onclick="togglePanel()">⋮</button></div>
  <div class="search"><input id="search" placeholder="বন্ধু খুঁজুন..." oninput="renderFriends()"></div>
  <div id="friends" class="list"></div>
 </aside>
 <main class="main">
  <div class="chathead"><button class="icon back" onclick="closeChat()">‹</button><div class="avatar" id="friendAvatar">?</div><div class="info"><b id="friendName">চ্যাট</b><small id="friendStatus">অফলাইন</small></div><button class="icon" onclick="friendInfo()">ⓘ</button></div>
  <div id="messages" class="messages"></div>
  <div class="composer"><label class="filebtn" style="margin:0">＋<input id="media" type="file" accept="image/*,video/*" hidden onchange="uploadMedia()"></label><input id="text" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div>
 </main>
 <div id="panel" class="panel hidden">
  <h3>অ্যাকাউন্ট ও সেটিংস</h3>
  <p><b id="panelName"></b><br><small id="panelPhone"></small></p>
  <button class="secondary" onclick="addFriend()">＋ বন্ধু যোগ করুন</button>
  <button class="secondary" onclick="showAccounts()">অ্যাকাউন্ট পরিবর্তন</button>
  <button class="secondary" onclick="logout()">লগআউট</button>
  <p style="font-size:12px;color:#687">নির্মাতা: হাফেজ মোহাম্মদ বাইজিদ হাসান<br>যোগাযোগ: 01982641237</p>
 </div>
</div>

<div id="modal" class="modal hidden"><div class="card"><div id="modalBody"></div><button class="secondary" onclick="closeModal()">বন্ধ করুন</button></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API=location.origin;
let token=localStorage.getItem('bd_token'), me=null, friends=[], current=null, socket=null, messages=[];
const $=id=>document.getElementById(id);
function msg(t){$('authMsg').textContent=t}
async function api(path,opt={}){
 opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},token?{'Authorization':'Bearer '+token}:{});
 let r=await fetch(API+path,opt), d=await r.json().catch(()=>({}));
 if(!r.ok) throw Error(d.error||'Server error'); return d;
}
async function register(){
 try{
  const name=$('name').value.trim(), phone=$('phone').value.trim(), pin=$('pin').value.trim();
  const d=await api('/api/register',{method:'POST',body:JSON.stringify({name,phone,country:$('country').value,pin})});
  token=d.token; localStorage.setItem('bd_token',token); await start();
 }catch(e){msg(e.message)}
}
async function login(){
 try{
  const phone=$('phone').value.trim(), pin=$('pin').value.trim();
  const d=await api('/api/login',{method:'POST',body:JSON.stringify({phone,pin})});
  token=d.token; localStorage.setItem('bd_token',token); await start();
 }catch(e){msg(e.message)}
}
async function start(){
 try{me=(await api('/api/me')).user}catch(e){localStorage.removeItem('bd_token');token=null;return msg('সেশন শেষ হয়েছে')}
 $('auth').classList.add('hidden');$('app').classList.remove('hidden');
 $('myName').textContent=me.name;$('myCode').textContent='User Code: '+me.friend_code;
 $('myAvatar').textContent=(me.name||'U')[0].toUpperCase();
 $('panelName').textContent=me.name;$('panelPhone').textContent=me.phone;
 await loadFriends(); connectSocket();
}
async function loadFriends(){friends=(await api('/api/friends')).friends;renderFriends()}
function renderFriends(){
 const q=$('search').value.toLowerCase();
 const arr=friends.filter(f=>(f.name+' '+f.friend_code).toLowerCase().includes(q));
 $('friends').innerHTML=arr.length?arr.map(f=>`<div class="row" onclick="openChat('${f.friend_code}')"><div class="avatar">${(f.name||'?')[0]}</div><div class="info"><b>${esc(f.name)}</b><small>User Code: ${f.friend_code}</small></div><span class="dot ${f.online?'on':''}"></span></div>`).join(''):'<div class="empty">কোনো বন্ধু নেই। ⋮ থেকে “বন্ধু যোগ করুন” চাপুন।</div>';
}
async function openChat(code){
 current=friends.find(f=>f.friend_code===code); if(!current)return;
 $('friendName').textContent=current.name;$('friendAvatar').textContent=(current.name||'?')[0];
 $('friendStatus').textContent=current.online?'অনলাইন':'অফলাইন';
 $('app').classList.add('chat-open'); await loadMessages(); await api('/api/chats/'+encodeURIComponent(code)+'/read',{method:'POST'}).catch(()=>{});
}
function closeChat(){$('app').classList.remove('chat-open');current=null}
async function loadMessages(){messages=(await api('/api/chats/'+encodeURIComponent(current.friend_code)+'/messages')).messages;renderMessages()}
function renderMessages(){
 $('messages').innerHTML=messages.map(m=>{
  let body=m.type==='image'?`<img class="media" src="${esc(m.media_url)}">`:m.type==='video'?`<video class="media" controls src="${esc(m.media_url)}"></video>`:esc(m.text||'');
  return `<div class="bubble ${m.sender_id===me.id?'mine':'theirs'}">${body}<div class="time">${new Date(m.created_at).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})} ${m.sender_id===me.id?(m.seen_at?'✓✓':'✓'):''}</div></div>`
 }).join('');
 $('messages').scrollTop=$('messages').scrollHeight;
}
async function send(){
 if(!current)return;let text=$('text').value.trim();if(!text)return;
 $('text').value='';
 try{let d=await api('/api/chats/'+encodeURIComponent(current.friend_code)+'/messages',{method:'POST',body:JSON.stringify({type:'text',text})});messages.push(d.message);renderMessages()}catch(e){alert(e.message)}
}
async function uploadMedia(){
 if(!current)return;let f=$('media').files[0];if(!f)return;
 let fd=new FormData();fd.append('file',f);fd.append('friend_code',current.friend_code);
 let r=await fetch(API+'/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
 let d=await r.json();if(!r.ok)return alert(d.error||'আপলোড ব্যর্থ');
 let type=f.type.startsWith('video/')?'video':'image';
 let x=await api('/api/chats/'+encodeURIComponent(current.friend_code)+'/messages',{method:'POST',body:JSON.stringify({type,media_url:d.url,text:''})});
 messages.push(x.message);renderMessages();$('media').value='';
}
function connectSocket(){
 socket=io({auth:{token}});
 socket.on('message:new',async m=>{
  if(current && (m.sender_id===current.id||m.receiver_id===current.id)){messages.push(m);renderMessages()}
  await loadFriends();
 });
 socket.on('presence',p=>{let f=friends.find(x=>x.id===p.user_id);if(f){f.online=p.online;renderFriends();if(current&&current.id===p.user_id)$('friendStatus').textContent=p.online?'অনলাইন':'অফলাইন'}});
}
async function addFriend(){
 let code=prompt('বন্ধুর ৪ সংখ্যার User Code দিন:');if(!code)return;
 try{let d=await api('/api/friends/add',{method:'POST',body:JSON.stringify({friend_code:code})});alert(d.message);await loadFriends()}catch(e){alert(e.message)}
}
async function friendInfo(){
 if(!current)return;
 $('modalBody').innerHTML=`<h2>${esc(current.name)}</h2><p>User Code: <b>${current.friend_code}</b></p><p>ফোন: ${esc(current.phone||'')}</p><button class="primary" onclick="blockUser()">${current.blocked?'Unblock':'Block'}</button>`;
 $('modal').classList.remove('hidden');
}
async function blockUser(){try{let d=await api('/api/block/'+encodeURIComponent(current.friend_code),{method:current.blocked?'DELETE':'POST'});alert(d.message);closeModal();await loadFriends()}catch(e){alert(e.message)}}
function togglePanel(){$('panel').classList.toggle('hidden')}
function showAccounts(){
 api('/api/accounts').then(d=>{$('modalBody').innerHTML='<h3>এই ডিভাইসের সেভ করা অ্যাকাউন্ট</h3>'+d.accounts.map(a=>`<p><b>${esc(a.name)}</b><br>User Code: ${a.friend_code}</p>`).join('')+'<button class="primary" onclick="location.reload()">নতুন অ্যাকাউন্ট লগইন/রেজিস্টার</button>';$('modal').classList.remove('hidden')})
}
function logout(){localStorage.removeItem('bd_token');location.reload()}
function closeModal(){$('modal').classList.add('hidden')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(token)start();
</script>
</body></html>
