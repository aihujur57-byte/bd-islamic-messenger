<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BD Islamic Messenger</title><style>:root{--g:#075e3b;--g2:#0d8a58;--mint:#e9f7ef;--ink:#17352a;--gold:#d8b15a}*{box-sizing:border-box}body{margin:0;background:#dfeee6;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{max-width:520px;margin:auto;height:100dvh;background:#fff;overflow:hidden;position:relative}.screen{height:100%;overflow:auto}.hidden{display:none!important}button{font:inherit;border:0;cursor:pointer}header{background:linear-gradient(135deg,#064d32,#0d8a58);color:#fff;padding:15px 16px 18px;border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:16px;background:#ffffff20;display:grid;place-items:center;font-size:25px}.brand b{font-size:18px}.brand small{display:block;opacity:.82}.search{width:100%;margin-top:13px;padding:12px 14px;border:1px solid #ffffff33;border-radius:15px;background:#ffffff18;color:white;outline:0}.search::placeholder{color:#d9efe4}main{height:calc(100% - 82px);overflow:auto;padding-bottom:80px}.pad{padding:14px}.stories{display:flex;gap:12px;overflow:auto;padding:14px 14px 8px}.story{min-width:68px;text-align:center;font-size:11px}.avatar{width:56px;height:56px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,#d9f2e2,#87caa3);border:3px solid #d5eadc;font-weight:800;color:var(--g);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chat{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid #edf2ef}.chatbody{flex:1;min-width:0}.chatbody b{display:flex;justify-content:space-between}.muted{color:#789087;font-size:13px}.badge{background:var(--g2);color:white;border-radius:20px;padding:2px 7px;font-size:10px}.card{margin:12px 14px;border:1px solid #e3eee8;border-radius:20px;padding:16px;box-shadow:0 6px 20px #0b5c3b0d}.primary{width:100%;padding:13px;border-radius:14px;background:var(--g);color:white;font-weight:800;margin-top:10px}.secondary{width:100%;padding:12px;border-radius:14px;background:#edf6f0;color:var(--g);font-weight:700;margin-top:8px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9e6df;border-radius:13px;margin-top:6px;outline:0;background:#fff}.row{padding:14px 2px;border-bottom:1px solid #edf2ef;display:flex;justify-content:space-between}nav{position:absolute;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #e6eee9;display:flex;justify-content:space-around;z-index:4}nav button{background:none;color:#819088;font-size:11px}nav .active{color:var(--g);font-weight:800}.ni{display:block;font-size:21px}.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:19px;background:var(--g);color:#fff;font-size:28px;z-index:3;box-shadow:0 8px 20px #075e3b44}.auth{height:100%;overflow:auto;background:linear-gradient(160deg,#064d32,#0d8a58);color:#fff;padding:34px 20px}.authbox{max-width:430px;margin:0 auto;background:#fff;color:var(--ink);border-radius:28px;padding:22px;box-shadow:0 20px 50px #001d1228}.authlogo{text-align:center;font-size:52px}.tabs{display:flex;background:#edf6f0;border-radius:14px;padding:4px;margin:15px 0}.tabs button{flex:1;padding:10px;border-radius:11px;background:transparent;color:#587064}.tabs .on{background:#fff;color:var(--g);font-weight:800;box-shadow:0 2px 8px #0000000c}.chatview{height:100%;background:#edf7f1;display:flex;flex-direction:column}.chathead{background:var(--g);color:#fff;padding:10px;display:flex;align-items:center;gap:9px}.back{background:none;color:#fff;font-size:28px}.messages{flex:1;overflow:auto;padding:14px}.bubble{max-width:80%;background:#fff;border-radius:16px;padding:9px 12px;margin:6px 0;box-shadow:0 2px 5px #00000009}.mine{margin-left:auto;background:#d7f1df}.bubble img,.bubble video{max-width:100%;border-radius:12px}.composer{display:flex;gap:6px;padding:8px;background:#fff}.composer input{margin:0;flex:1}.send{width:44px;border-radius:13px;background:var(--g);color:#fff}.modal{position:absolute;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:25px 25px 0 0;padding:18px;max-height:90%;overflow:auto}.close{float:right;background:#eef4f0;border-radius:10px;width:35px;height:35px}.preview{width:90px;height:90px;border-radius:50%;object-fit:cover;margin:8px auto;display:block}.online{font-size:10px;color:#15945e}.toast{position:absolute;left:15px;right:15px;bottom:82px;background:#17352a;color:#fff;padding:12px 15px;border-radius:14px;z-index:30}.sectiontitle{padding:14px 14px 4px;font-weight:800}.empty{text-align:center;padding:30px 15px;color:#789087}</style></head><body><div class="app"><div id="auth" class="auth"><div class="authbox"><div class="authlogo">☪</div><h1 style="text-align:center;margin:0;color:#075e3b">BD Islamic Messenger</h1><p style="text-align:center;color:#789087">ইসলামের পথে, একসাথে</p><div class="tabs"><button id="rtab" class="on" onclick="authMode('register')">Register</button><button id="ltab" onclick="authMode('login')">Login</button></div><div id="authForm"></div></div></div><div id="homeApp" class="hidden screen"><header><div class="brand"><div class="logo">☪</div><div><b>BD Islamic Messenger</b><small>নিরাপদ • সহজ • ইসলামিক</small></div><button onclick="menu()" style="margin-left:auto;background:#ffffff18;color:white;border-radius:12px;width:40px;height:40px">⋮</button></div><input id="search" class="search" placeholder="নাম বা চ্যাট খুঁজুন..." oninput="renderFriends()"></header><main><section id="home" class="view"><div class="stories" id="storiesRow"></div><div class="sectiontitle">চ্যাটস</div><div id="friendList"></div></section><section id="groups" class="view hidden"><div class="card"><h2>👥 Groups</h2><p class="muted">গ্রুপ চ্যাটের জায়গা প্রস্তুত।</p><button class="primary" onclick="toast('Group system পরের backend ধাপে যুক্ত হবে')">নতুন গ্রুপ</button></div></section><section id="status" class="view hidden"><div class="card"><h2>◉ Status / Story</h2><p class="muted">Story ৭২ ঘণ্টা থাকবে।</p><button class="primary" onclick="newStory()">＋ Story যোগ করুন</button></div><div id="storyList"></div></section><section id="profile" class="view hidden"><div class="card" style="text-align:center"><div id="myAvatar" class="avatar" style="width:105px;height:105px;font-size:40px"></div><h2 id="myName">আপনার প্রোফাইল</h2><p id="myPhone" class="muted"></p><p id="myCode" class="muted"></p><button class="primary" onclick="editProfile()">প্রোফাইল এডিট</button></div><div class="card"><div class="row">🔒 Privacy <span>›</span></div><div class="row">🔔 Notifications <span>›</span></div><div class="row">🚫 Blocked contacts <span>›</span></div><div class="row">ℹ️ About <span>›</span></div></div></section><section id="chat" class="view hidden" style="height:100%"><div class="chatview"><div class="chathead"><button class="back" onclick="goHome()">‹</button><div id="chatAvatar" class="avatar" style="width:42px;height:42px"></div><div><b id="chatName">Friend</b><div id="chatOnline" style="font-size:11px"></div></div><button onclick="startCall()" style="margin-left:auto;background:#ffffff18;color:#fff;border-radius:10px;padding:9px">📞</button></div><div id="messages" class="messages"></div><div class="composer"><button onclick="pickMedia()">＋</button><input id="msg" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key==='Enter')sendText()"><button class="send" onclick="sendText()">➤</button><input id="media" hidden type="file" accept="image/*,video/*,audio/*,application/pdf" onchange="sendMedia(this.files[0])"></div></div></section></main><nav><button id="n0" class="active" onclick="tab('home',this)"><span class="ni">💬</span>Chats</button><button id="n1" onclick="tab('groups',this)"><span class="ni">👥</span>Groups</button><button id="n2" onclick="tab('status',this)"><span class="ni">◉</span>Status</button><button id="n3" onclick="tab('profile',this)"><span class="ni">👤</span>Profile</button></nav><button id="fab" class="fab" onclick="addFriend()">＋</button></div><div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="sheet"></div></div></div><div id="toast" class="toast hidden"></div></div><script>let token=localStorage.getItem('bdim_token')||'',me=null,friends=[],active=null,socket=null;const $=id=>document.getElementById(id);async function api(p,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(p,o);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Request failed');return j}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}function authMode(m){$('rtab').classList.toggle('on',m==='register');$('ltab').classList.toggle('on',m==='login');$('authForm').innerHTML=m==='register'?`<h2>নতুন Account খুলুন</h2><label>নাম</label><input id="an" placeholder="আপনার নাম"><label>দেশ</label><select id="ac"><option value="+880">🇧🇩 Bangladesh +880</option><option value="+91">🇮🇳 India +91</option><option value="+92">🇵🇰 Pakistan +92</option><option value="+1">🇺🇸 USA +1</option><option value="+44">🇬🇧 UK +44</option><option value="+966">🇸🇦 Saudi Arabia +966</option><option value="+971">🇦🇪 UAE +971</option></select><label>ফোন নম্বর</label><input id="ap" inputmode="tel" placeholder="ফোন নম্বর"><label>নিজের ৪ সংখ্যার Secret Code</label><input id="ai" inputmode="numeric" maxlength="4" placeholder="1234"><button class="primary" onclick="register()">Register</button>`:`<h2>Login করুন</h2><label>ফোন নম্বর</label><input id="lp" inputmode="tel" placeholder="ফোন নম্বর"><label>৪ সংখ্যার Secret Code</label><input id="li" inputmode="numeric" maxlength="4" placeholder="1234"><button class="primary" onclick="login()">Login</button><button class="secondary" onclick="authMode('register')">নতুন Account খুলুন</button>`}async function register(){try{const name=$('an').value.trim(),phone=$('ap').value.trim(),pin=$('ai').value.trim();if(!name||!phone||!/^[0-9]{4}$/.test(pin))return toast('নাম, ফোন ও ৪ সংখ্যার Secret Code দিন');await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,country:$('ac').value,phone,pin})});toast('Registration সফল। এখন Login করুন।');authMode('login');$('lp').value=phone;$('li').value=pin}catch(e){toast(e.message)}}async function login(){try{const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('lp').value.trim(),pin:$('li').value.trim()})});token=j.token;localStorage.setItem('bdim_token',token);await boot()}catch(e){toast(e.message)}}async function boot(){try{me=await api('/api/me');$('auth').classList.add('hidden');$('homeApp').classList.remove('hidden');renderMe();await loadFriends();loadStories();connect()}catch(e){localStorage.removeItem('bdim_token');token='';authMode('login');toast(e.message)}}function renderMe(){ $('myName').textContent=me.name||'আপনার প্রোফাইল';$('myPhone').textContent=(me.country||'')+' '+(me.phone||'');$('myCode').textContent='Secret Code: '+(me.code||'');$('myAvatar').innerHTML=me.avatarUrl?`<img src="${me.avatarUrl}">`:(me.name||'U')[0]}async function loadFriends(){friends=await api('/api/friends');renderFriends()}function renderFriends(){const q=($('search').value||'').toLowerCase();const a=friends.filter(f=>(f.name||'').toLowerCase().includes(q)||(f.code||'').includes(q));$('friendList').innerHTML=a.length?a.map(f=>`<div class="chat" onclick='openChat(${JSON.stringify(f)})'><div class="avatar">${f.avatarUrl?`<img src="${f.avatarUrl}">`:(f.name||'F')[0]}</div><div class="chatbody"><b>${esc(f.name||'Friend')} <span class="muted">${f.online?'অনলাইন':'অফলাইন'}</span></b><div class="muted">Secret Code: ${esc(f.code||'')}</div></div>${f.unread?'<span class="badge">নতুন</span>':''}</div>`).join(''):'<div class="empty">কোনো বন্ধু নেই। ＋ চাপ দিয়ে ৪ সংখ্যার Code দিয়ে বন্ধু যোগ করুন।</div>'}function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('fab').style.display=id==='home'?'block':'none';if(id==='status')loadStories()}function goHome(){tab('home',$('n0'))}function addFriend(){openModal(`<h2>🌍 Friend Connect</h2><p class="muted">বন্ধুর ৪ সংখ্যার Secret Code লিখুন</p><input id="fc" inputmode="numeric" maxlength="4" placeholder="• • • •"><button class="primary" onclick="doAddFriend()">বন্ধু যোগ করুন</button>`)}async function doAddFriend(){const c=$('fc').value.trim();if(!/^\d{4}$/.test(c))return toast('ঠিক ৪ সংখ্যার Code দিন');try{const j=await api('/api/friends/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})});closeModal();toast('বন্ধু যোগ হয়েছে');await loadFriends()}catch(e){toast(e.message)}}function openChat(f){active=f;$('chatName').textContent=f.name||'Friend';$('chatOnline').textContent=f.online?'● Online':'Offline';$('chatAvatar').innerHTML=f.avatarUrl?`<img src="${f.avatarUrl}">`:(f.name||'F')[0];tab('chat',$('n0'));loadMessages()}async function loadMessages(){try{const a=await api('/api/chats/'+encodeURIComponent(active.code)+'/messages');$('messages').innerHTML=a.map(renderMsg).join('');$('messages').scrollTop=$('messages').scrollHeight}catch(e){toast(e.message)}}function renderMsg(m){const mine=Number(m.senderId)===Number(me.id);let c=m.type==='image'?`<img src="${m.mediaUrl}">`:m.type==='video'?`<video src="${m.mediaUrl}" controls></video>`:m.type==='audio'?`<audio src="${m.mediaUrl}" controls></audio>`:m.type==='file'?`<a href="${m.mediaUrl}" target="_blank">📎 ${esc(m.body||'File')}</a>`:esc(m.body||'');return `<div class="bubble ${mine?'mine':''}">${c}<div class="muted" style="text-align:right">${m.seen?'✓✓':'✓'}</div></div>`}async function sendText(){const v=$('msg').value.trim();if(!v||!active)return;try{await api('/api/chats/'+encodeURIComponent(active.code)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'text',body:v})});$('msg').value=''}catch(e){toast(e.message)}}function pickMedia(){$('media').click()}async function sendMedia(f){if(!f||!active)return;try{toast('ফাইল আপলোড হচ্ছে...');const fd=new FormData();fd.append('file',f);const u=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+encodeURIComponent(active.code)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:u.type,mediaUrl:u.url,body:u.name||''})});toast('পাঠানো হয়েছে')}catch(e){toast(e.message)}}function editProfile(){openModal(`<h2>👤 Profile</h2><div id="epav" class="avatar" style="width:100px;height:100px;font-size:35px">${me.avatarUrl?`<img src="${me.avatarUrl}">`:(me.name||'U')[0]}</div><input id="en" value="${esc(me.name||'')}"><p class="muted">Profile Photo</p><input id="ef" type="file" accept="image/*"><button class="primary" onclick="saveProfile()">Save Profile</button>`)}async function saveProfile(){try{let avatar=me.avatarUrl;if($('ef').files[0]){const fd=new FormData();fd.append('file',$('ef').files[0]);const u=await api('/api/upload',{method:'POST',body:fd});avatar=u.url}me=await api('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('en').value.trim(),avatarUrl:avatar})});closeModal();renderMe();toast('Profile আপডেট হয়েছে')}catch(e){toast(e.message)}}function newStory(){openModal(`<h2>◉ নতুন Story</h2><textarea id="sb" placeholder="কিছু লিখুন..."></textarea><input id="sf" type="file" accept="image/*,video/*"><button class="primary" onclick="postStory()">Story প্রকাশ করুন</button>`)}async function postStory(){try{let body=$('sb').value.trim(),url='',type='text';if($('sf').files[0]){const f=$('sf').files[0];const fd=new FormData();fd.append('file',f);const u=await api('/api/upload',{method:'POST',body:fd});url=u.url;type=u.type}await api('/api/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,body,mediaUrl:url})});closeModal();toast('Story প্রকাশ হয়েছে');loadStories()}catch(e){toast(e.message)}}async function loadStories(){try{const a=await api('/api/stories');$('storiesRow').innerHTML='<div class="story" onclick="newStory()"><div class="avatar">＋</div>আপনার Story</div>'+a.slice(0,15).map(s=>`<div class="story"><div class="avatar">${s.avatar_url?`<img src="${s.avatar_url}">`:(s.name||'S')[0]}</div>${esc(s.name)}</div>`).join('');$('storyList').innerHTML=a.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="muted">${s.type==='text'?esc(s.body):s.type==='image'?`<img src="${s.media_url}" style="max-width:100%;border-radius:15px">`:`<video src="${s.media_url}" controls style="max-width:100%;border-radius:15px"></video>`}</div></div>`).join('')}catch(e){}}function menu(){openModal(`<h2>☪ Menu</h2><div class="row" onclick="closeModal();tab('profile',$('n3'))">👤 Profile <span>›</span></div><div class="row" onclick="closeModal();addFriend()">➕ Add Friend <span>›</span></div><div class="row">⚙️ Settings <span>›</span></div><div class="row">🛡️ Privacy <span>›</span></div><div class="row">ℹ️ About <span>›</span></div><button class="primary" onclick="logout()">Logout</button>`)}function logout(){localStorage.removeItem('bdim_token');token='';if(socket)socket.disconnect();location.reload()}function startCall(){toast('Call signaling প্রস্তুত; পূর্ণ WebRTC call UI পরের ধাপে যুক্ত হবে')}function connect(){if(!window.io||!token)return;socket=io({auth:{token}});socket.on('message:new',m=>{if(active&&Number(m.senderId)===Number(active.id)){ $('messages').insertAdjacentHTML('beforeend',renderMsg(m));$('messages').scrollTop=$('messages').scrollHeight}else loadFriends()});socket.on('message:sent',m=>{if(active&&Number(m.receiverId)===Number(active.id)){ $('messages').insertAdjacentHTML('beforeend',renderMsg(m));$('messages').scrollTop=$('messages').scrollHeight}});socket.on('presence',()=>loadFriends())}function openModal(h){$('sheet').innerHTML=h;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}authMode('register');if(token)boot()</script><script src="/socket.io/socket.io.js"></script></body></html>
