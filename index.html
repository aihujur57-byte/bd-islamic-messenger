<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BD Islamic Messenger</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#eef7f0;color:#123;font-size:15px}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 20px #0001}.top{background:#087f3d;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top h2{margin:0;font-size:20px}.page{padding:16px}.card{background:#fff;border:1px solid #dcebe0;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0000000a}.hero{text-align:center;padding:30px 16px}.logo{font-size:48px}.muted{color:#68766d;font-size:13px}.input{width:100%;padding:13px 14px;border:1px solid #c9d9ce;border-radius:12px;margin:6px 0 10px;font-size:16px;outline:none}.input:focus{border-color:#087f3d}.btn{border:0;border-radius:12px;padding:12px 15px;background:#087f3d;color:#fff;font-size:15px;font-weight:700;cursor:pointer}.btn.alt{background:#e9f5ed;color:#087f3d}.btn.red{background:#c62828}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.center{text-align:center}.hide{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.friend{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #edf2ee;cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:#087f3d;color:#fff;display:grid;place-items:center;font-weight:bold}.friend b{display:block}.dot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}.dot.on{background:#16a34a}.chat{height:calc(100vh - 145px);display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:14px;background:#f5faf6}.bubble{max-width:78%;padding:10px 12px;border-radius:15px;margin:6px 0;word-wrap:break-word}.me{margin-left:auto;background:#cfeedd;border-bottom-right-radius:4px}.them{background:#fff;border:1px solid #e1ebe4;border-bottom-left-radius:4px}.bubble img,.bubble video{max-width:100%;border-radius:10px;display:block}.composer{display:flex;gap:6px;padding:10px;border-top:1px solid #ddd;background:#fff}.composer input{flex:1;margin:0}.small{font-size:11px;color:#718078;margin-top:4px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-width:620px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:85vh;overflow:auto}.danger{color:#b71c1c}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#123;color:#fff;padding:11px 15px;border-radius:12px;z-index:50;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="modal" class="modal hide"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast hide"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('bdim_token')||'', me=null, friends=[], current=null, socket=null;
const accounts=()=>JSON.parse(localStorage.getItem('bdim_accounts')||'[]');
function saveAccount(u,t){let a=accounts().filter(x=>x.phone!==u.phone);a.unshift({name:u.name,phone:u.phone,code:u.code,token:t});localStorage.setItem('bdim_accounts',JSON.stringify(a).slice(0,30000));}
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2200)}
async function api(url,opt={}){let h=opt.headers||{};if(!(opt.body instanceof FormData))h['Content-Type']='application/json';if(token)h.Authorization='Bearer '+token;let r=await fetch(url,{...opt,headers:h});let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||'সার্ভার সমস্যা');return d}
function shell(title='BD Islamic Messenger',back=false){return `<div class="top"><div>${back?'<button class="btn alt" onclick="home()">←</button>':''}</div><h2>${esc(title)}</h2><button class="btn alt" onclick="menu()">☰</button></div><div id="content" class="page"></div>`}
function auth(){ $('app').innerHTML=`<div class="hero"><div class="logo">☪️</div><h1>BD Islamic Messenger</h1><p class="muted">সহজ, নিরাপদ ও ইসলামিক থিমের অনলাইন মেসেঞ্জার</p></div><div class="page"><div class="tabs"><button id="lt" class="btn" onclick="showLogin()">লগইন</button><button id="rt" class="btn alt" onclick="showRegister()">নতুন অ্যাকাউন্ট</button></div><div id="authbox" class="card"></div></div>`;showLogin()}
function showLogin(){ $('authbox').innerHTML=`<h3>লগইন</h3><label>ফোন নম্বর</label><input id="phone" class="input" inputmode="tel" placeholder="01XXXXXXXXX"><label>৪ সংখ্যার User Code / PIN</label><input id="pin" class="input" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn" style="width:100%" onclick="login()">লগইন করুন</button>` }
function showRegister(){ $('authbox').innerHTML=`<h3>নতুন অ্যাকাউন্ট</h3><input id="name" class="input" placeholder="আপনার নাম"><input id="phone" class="input" inputmode="tel" placeholder="01XXXXXXXXX"><input id="pin" class="input" inputmode="numeric" maxlength="4" placeholder="নিজের ৪ সংখ্যার User Code / PIN"><p class="muted">OTP লাগবে না। ৪ সংখ্যার কোডটি মনে রাখবেন।</p><button class="btn" style="width:100%" onclick="register()">অ্যাকাউন্ট তৈরি করুন</button>` }
async function login(){try{let phone=$('phone').value.trim(),pin=$('pin').value.trim();if(!/^\d{4}$/.test(pin))throw Error('৪ সংখ্যার কোড দিন');let d=await api('/api/login',{method:'POST',body:JSON.stringify({phone,pin})});token=d.token;me=d.user;localStorage.setItem('bdim_token',token);saveAccount(me,token);await start()}catch(e){toast(e.message)}}
async function register(){try{let name=$('name').value.trim(),phone=$('phone').value.trim(),pin=$('pin').value.trim();if(!name||!phone||!/^[0-9]{4}$/.test(pin))throw Error('নাম, ফোন ও ৪ সংখ্যার কোড দিন');let d=await api('/api/register',{method:'POST',body:JSON.stringify({name,country:'+880',phone,pin})});token=d.token;me=d.user;localStorage.setItem('bdim_token',token);saveAccount(me,token);await start()}catch(e){toast(e.message)}}
async function start(){try{me=await api('/api/me');friends=await api('/api/friends');home();connect()}catch(e){token='';localStorage.removeItem('bdim_token');auth()}}
function home(){current=null;$('app').innerHTML=shell('BD Islamic Messenger');renderHome()}
function renderHome(){let c=$('content');c.innerHTML=`<div class="card"><b>${esc(me.name)}</b><div class="muted">User Code: ${esc(me.code)} · ${esc(me.phone)}</div></div><div class="row"><button class="btn" onclick="addFriend()">＋ Friend যোগ করুন</button><button class="btn alt" onclick="profile()">প্রোফাইল</button></div><div class="card"><h3>আমার Friends</h3><div id="flist"></div></div>`;renderFriends()}
function renderFriends(){let el=$('flist');if(!friends.length){el.innerHTML='<p class="muted">এখনও কোনো Friend নেই। User Code দিয়ে Friend যোগ করুন।</p>';return}el.innerHTML=friends.map(f=>`<div class="friend" onclick="openChat('${esc(f.code)}')"><div class="avatar">${esc((f.name||'?')[0])}</div><div style="flex:1"><b>${esc(f.name)}</b><span class="muted">${esc(f.code)}</span><div><span class="dot ${f.online?'on':''}"></span> ${f.online?'Online':'Offline'} ${f.unread?' · নতুন মেসেজ':''}</div></div></div>`).join('')}
async function addFriend(){let code=prompt('বন্ধুর ৪ সংখ্যার User Code দিন');if(!code)return;try{let d=await api('/api/friends/add',{method:'POST',body:JSON.stringify({code})});friends=await api('/api/friends');toast(d.user.name+' Friend হিসেবে যোগ হয়েছে');renderHome()}catch(e){toast(e.message)}}
async function openChat(code){current=friends.find(x=>x.code===code)||null;if(!current)return;$('app').innerHTML=shell(current.name,true);$('content').className='chat';$('content').innerHTML='<div id="msgs" class="msgs">লোড হচ্ছে...</div><div class="composer"><input id="msg" class="input" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key===\'Enter\')sendText()"><button class="btn" onclick="sendText()">➤</button><button class="btn alt" onclick="pickMedia()">📎</button><input id="file" type="file" accept="image/*,video/*" hidden onchange="sendMedia()"></div>';await loadMessages();await api('/api/chats/'+encodeURIComponent(code)+'/read',{method:'POST'}).catch(()=>{});friends=friends.map(f=>f.code===code?{...f,unread:false}:f)}
async function loadMessages(){try{let d=await api('/api/chats/'+encodeURIComponent(current.code)+'/messages');renderMessages(Array.isArray(d)?d:(d.messages||[]))}catch(e){toast(e.message)}}
function renderMessages(arr){let el=$('msgs');if(!el)return;el.innerHTML=arr.map(m=>{let mine=String(m.senderCode)===String(me.code);let media=m.type==='image'?`<img src="${esc(m.mediaUrl)}">`:m.type==='video'?`<video src="${esc(m.mediaUrl)}" controls></video>`:'';return `<div class="bubble ${mine?'me':'them'}">${media}${m.body?`<div>${esc(m.body)}</div>`:''}<div class="small">${new Date(m.createdAt).toLocaleString('bn-BD')} ${mine?(m.seen?'✓✓':'✓'):''}</div></div>`}).join('');el.scrollTop=el.scrollHeight}
async function sendText(){let v=$('msg').value.trim();if(!v||!current)return;try{await api('/api/chats/'+encodeURIComponent(current.code)+'/messages',{method:'POST',body:JSON.stringify({type:'text',body:v})});$('msg').value='';await loadMessages()}catch(e){toast(e.message)}}
function pickMedia(){$('file').click()}
async function sendMedia(){let f=$('file').files[0];if(!f)return;try{let fd=new FormData();fd.append('file',f);let up=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+encodeURIComponent(current.code)+'/messages',{method:'POST',body:JSON.stringify({type:up.type,mediaUrl:up.url})});await loadMessages()}catch(e){toast(e.message)}$('file').value=''}
function profile(){ $('modal').classList.remove('hide');$('sheet').innerHTML=`<h2>আমার প্রোফাইল</h2><div class="card"><b>${esc(me.name)}</b><p>ফোন: ${esc(me.phone)}</p><p>User Code: <b>${esc(me.code)}</b></p><p class="muted">BD Islamic Messenger</p></div><button class="btn red" style="width:100%" onclick="logout()">লগআউট</button><button class="btn alt" style="width:100%;margin-top:8px" onclick="closeModal()">বন্ধ করুন</button>`}
function menu(){ $('modal').classList.remove('hide');$('sheet').innerHTML=`<h2>Menu</h2><button class="btn alt" style="width:100%;margin:5px 0" onclick="home();closeModal()">🏠 Home</button><button class="btn alt" style="width:100%;margin:5px 0" onclick="addFriend();closeModal()">＋ Friend যোগ করুন</button><button class="btn alt" style="width:100%;margin:5px 0" onclick="accountsMenu()">👥 Account Switch</button><button class="btn alt" style="width:100%;margin:5px 0" onclick="profile();">👤 Profile</button><button class="btn red" style="width:100%;margin:5px 0" onclick="logout()">Logout</button>`}
function accountsMenu(){let a=accounts();$('sheet').innerHTML='<h2>Saved Accounts</h2>'+a.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.code)}</div><button class="btn" style="margin-top:8px" onclick="switchAccount(${i})">এই অ্যাকাউন্টে ঢুকুন</button></div>`).join('')+'<button class="btn alt" onclick="closeModal()">বন্ধ</button>'}
async function switchAccount(i){let a=accounts()[i];if(!a)return;token=a.token;localStorage.setItem('bdim_token',token);closeModal();await start()}
function logout(){token='';me=null;localStorage.removeItem('bdim_token');if(socket)socket.disconnect();closeModal();auth()}
function closeModal(){$('modal').classList.add('hide')}
function connect(){if(socket)socket.disconnect();socket=io({auth:{token}});socket.on('message:new',m=>{if(current&&String(m.senderCode)===String(current.code)){loadMessages();api('/api/chats/'+encodeURIComponent(current.code)+'/read',{method:'POST'}).catch(()=>{})}else{friends=friends.map(f=>f.code===m.senderCode?{...f,unread:true}:f);if(!current)renderFriends()}});socket.on('message:sent',m=>{if(current&&String(m.senderCode)===String(me.code))loadMessages()});socket.on('presence',p=>{let f=friends.find(x=>x.id===p.userId);if(f){f.online=p.online;renderFriends()}})}
(async()=>{if(token)await start();else auth()})();
</script>
</body>
</html>
