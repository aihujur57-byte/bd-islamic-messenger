<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a3b">
<title>BD Islamic Messenger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f2f7f3;color:#123}
button,input{font:inherit}button{cursor:pointer}.hide{display:none!important}
.top{height:58px;background:#08783a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0}.icon{border:0;background:transparent;color:inherit;font-size:24px;padding:6px}
.wrap{max-width:720px;margin:auto}.page{min-height:100vh;background:#f2f7f3}
.card{background:#fff;border-radius:14px;padding:16px;margin:14px;box-shadow:0 2px 10px #00000010}
input,select{width:100%;padding:12px;border:1px solid #ccd8d0;border-radius:10px;margin:6px 0 10px;background:#fff}
.primary{width:100%;padding:12px;border:0;border-radius:10px;background:#08783a;color:#fff;font-weight:700}
.secondary{width:100%;padding:11px;border:1px solid #08783a;border-radius:10px;background:#fff;color:#08783a;font-weight:700;margin-top:8px}
.muted{color:#66756d;font-size:13px}.err{color:#b00020;font-size:13px}.ok{color:#08783a;font-size:13px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:58px;z-index:4}.tab{flex:1;padding:12px;border:0;background:#fff;color:#53635a}.tab.on{color:#08783a;font-weight:700;border-bottom:3px solid #08783a}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #eef1ef;background:#fff}.avatar{width:42px;height:42px;border-radius:50%;background:#08783a;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.grow{flex:1;min-width:0}.name{font-weight:700}.preview{font-size:13px;color:#718078;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#d33}.dot.on{background:#16a34a}
.chat{height:calc(100vh - 58px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:12px;background:#eaf4ed}
.bubble{max-width:82%;padding:9px 11px;border-radius:13px;margin:5px 0;white-space:pre-wrap;word-break:break-word}.mine{margin-left:auto;background:#ccefd8}.theirs{background:#fff}
.bubble img,.bubble video{max-width:100%;border-radius:9px;display:block}.composer{display:flex;gap:7px;padding:8px;background:#fff;border-top:1px solid #ddd}.composer input{margin:0}.send{width:48px;border:0;border-radius:10px;background:#08783a;color:#fff}.attach{width:45px;border:1px solid #ccc;border-radius:10px;background:#fff}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:20}.sheet{width:min(720px,100%);background:#fff;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.friendBtn{border:0;background:#e9f6ee;color:#08783a;border-radius:9px;padding:8px 10px;font-weight:700}
.search{padding:10px;background:#f2f7f3}
.auth{max-width:440px;margin:0 auto;padding:28px 14px}.logo{font-size:42px;text-align:center}.auth h2{text-align:center;color:#08783a}
label{font-size:13px;font-weight:700}.smallbtn{border:0;background:transparent;color:#08783a;font-weight:700;padding:4px}
</style>
</head>
<body>
<div id="app" class="page"></div>
<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>
<script>
const API=location.origin;
let token=localStorage.getItem('bdim_token')||'';
let me=null, friends=[], currentFriend=null, socket=null, poll=null;
const $=id=>document.getElementById(id);
async function api(path,opt={}){
  opt.headers=opt.headers||{};
  if(token) opt.headers.Authorization='Bearer '+token;
  const r=await fetch(API+path,opt);
  const t=await r.text(); let d={}; try{d=JSON.parse(t)}catch{}
  if(!r.ok) throw new Error(d.error||'সার্ভার সমস্যা');
  return d;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function auth(){
 $('app').innerHTML=`<div class="auth"><div class="logo">☪️</div><h2>BD Islamic Messenger</h2>
 <div class="card"><h3>নতুন অ্যাকাউন্ট</h3>
 <label>নাম</label><input id="rn" placeholder="আপনার নাম">
 <label>দেশ</label><select id="rc"><option value="+880">🇧🇩 বাংলাদেশ +880</option><option value="+91">🇮🇳 ভারত +91</option><option value="+92">🇵🇰 পাকিস্তান +92</option><option value="+966">🇸🇦 সৌদি আরব +966</option><option value="+971">🇦🇪 UAE +971</option><option value="+44">🇬🇧 UK +44</option><option value="+1">🇺🇸 USA +1</option></select>
 <label>ফোন নম্বর</label><input id="rp" inputmode="tel" placeholder="ফোন নম্বর">
 <label>৪ ডিজিট User Code / PIN</label><input id="rpin" inputmode="numeric" maxlength="4" placeholder="যেমন 1234">
 <button class="primary" onclick="register()">অ্যাকাউন্ট তৈরি করুন</button><p id="ae" class="err"></p>
 </div>
 <div class="card"><h3>লগইন</h3><input id="lp" inputmode="tel" placeholder="ফোন নম্বর"><input id="lpin" inputmode="numeric" maxlength="4" placeholder="৪ ডিজিট User Code / PIN">
 <button class="primary" onclick="login()">লগইন</button><p id="le" class="err"></p></div>
 <p class="muted">একটি ফোন নম্বর ও একটি User Code একটি অ্যাকাউন্টের জন্য ব্যবহার হবে। OTP নেই।</p></div>`;
}
async function register(){
 try{
  const d=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('rn').value,country:$('rc').value,phone:$('rp').value,pin:$('rpin').value})});
  token=d.token;localStorage.setItem('bdim_token',token);await start();
 }catch(e){$('ae').textContent=e.message}
}
async function login(){
 try{
  const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('lp').value,pin:$('lpin').value})});
  token=d.token;localStorage.setItem('bdim_token',token);await start();
 }catch(e){$('le').textContent=e.message}
}
async function start(){
 try{me=await api('/api/me');friends=await api('/api/friends');home();connect()}catch(e){token='';localStorage.removeItem('bdim_token');auth()}
}
function header(title='BD Islamic Messenger',back=false){return `<div class="top">${back?`<button class="icon" onclick="home()">‹</button>`:'<span></span>'}<h1>${esc(title)}</h1><button class="icon" onclick="menu()">⋮</button></div>`}
function home(){
 currentFriend=null;
 $('app').innerHTML=`${header()}<div class="tabs"><button class="tab on" onclick="showChats()">চ্যাট</button><button class="tab" onclick="showFriends()">ফ্রেন্ড</button></div><div id="body"></div>`;
 showChats();
}
function showChats(){
 const list=[...friends].sort((a,b)=>(b.lastMessageAt||0)-(a.lastMessageAt||0));
 $('body').innerHTML=`<div class="search"><input placeholder="নাম বা User Code খুঁজুন" oninput="filterChats(this.value)"></div><div id="chatlist">${list.map(frow).join('')||'<div class="card">কোনো ফ্রেন্ড নেই। Friend থেকে User Code দিয়ে যোগ করুন।</div>'}</div>`;
}
function filterChats(q){let x=q.toLowerCase();$('chatlist').innerHTML=friends.filter(f=>(f.name+' '+f.code).toLowerCase().includes(x)).map(frow).join('')||'<div class="card">পাওয়া যায়নি</div>'}
function frow(f){return `<div class="row" onclick="openChat('${esc(f.code)}')"><div class="avatar">${esc((f.name||'?')[0])}</div><div class="grow"><div class="name">${esc(f.name)} <span class="dot ${f.online?'on':''}"></span></div><div class="preview">Code: ${esc(f.code)}${f.unread?' • নতুন মেসেজ':''}</div></div></div>`}
function showFriends(){
 $('body').innerHTML=`<div class="card"><button class="primary" onclick="addFriend()">＋ User Code দিয়ে Friend যোগ করুন</button></div>${friends.map(frow).join('')}`;
}
function addFriend(){
 openModal(`<h3>Friend যোগ করুন</h3><input id="fc" inputmode="numeric" maxlength="4" placeholder="৪ ডিজিট User Code"><button class="primary" onclick="doAddFriend()">যোগ করুন</button><p id="fe" class="err"></p>`);
}
async function doAddFriend(){
 try{await api('/api/friends/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('fc').value})});closeModal();friends=await api('/api/friends');showFriends()}catch(e){$('fe').textContent=e.message}
}
async function openChat(code){
 currentFriend=friends.find(x=>x.code===code); if(!currentFriend)return;
 $('app').innerHTML=`${header(currentFriend.name,true)}<div class="chat"><div id="msgs" class="messages"></div><div class="composer"><input id="msg" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key==='Enter')sendText()"><label class="attach">📎<input id="file" type="file" accept="image/*,video/*" hidden onchange="sendMedia()"></label><button class="send" onclick="sendText()">➤</button></div></div>`;
 await loadMessages(); await api('/api/chats/'+encodeURIComponent(code)+'/read',{method:'POST'}).catch(()=>{});
 currentFriend.unread=0;
}
async function loadMessages(){
 try{let d=await api('/api/chats/'+encodeURIComponent(currentFriend.code)+'/messages');renderMessages(d.messages)}catch(e){$('msgs').innerHTML='<div class="card">'+esc(e.message)+'</div>'}
}
function renderMessages(arr){
 $('msgs').innerHTML=arr.map(m=>`<div class="bubble ${m.senderCode===me.code?'mine':'theirs'}">${m.type==='text'?esc(m.body):m.type==='image'?`<img src="${esc(m.mediaUrl)}">`:m.type==='video'?`<video src="${esc(m.mediaUrl)}" controls playsinline></video>`:''}<div class="muted">${new Date(m.createdAt).toLocaleString('bn-BD')} ${m.senderCode===me.code?(m.seen?'✓✓':'✓'):''}</div></div>`).join('');
 $('msgs').scrollTop=$('msgs').scrollHeight;
}
async function sendText(){
 let v=$('msg').value.trim();if(!v||!currentFriend)return;
 $('msg').value='';
 try{await api('/api/chats/'+encodeURIComponent(currentFriend.code)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'text',body:v})});await loadMessages()}catch(e){alert(e.message)}
}
async function sendMedia(){
 const f=$('file').files[0];if(!f)return;
 if(f.size>50*1024*1024){alert('ফাইল সর্বোচ্চ ৫০MB');return}
 const fd=new FormData();fd.append('file',f);
 try{const up=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+encodeURIComponent(currentFriend.code)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:up.type,mediaUrl:up.url,body:''})});await loadMessages()}catch(e){alert(e.message)}
}
function connect(){
 if(socket)socket.disconnect();
 const s=document.createElement('script');s.src='/socket.io/socket.io.js';s.onload=()=>{
  socket=io({auth:{token}});
  socket.on('message:new',async m=>{if(currentFriend&&m.senderCode===currentFriend.code){await loadMessages();await api('/api/chats/'+encodeURIComponent(currentFriend.code)+'/read',{method:'POST'})}else{friends=await api('/api/friends');if(!currentFriend)showChats()}});
  socket.on('presence',p=>{let f=friends.find(x=>x.code===p.code);if(f)f.online=p.online;if(!currentFriend)showChats()});
 };
 document.body.appendChild(s);
}
function menu(){
 openModal(`<h3>${esc(me.name)}</h3><p>ফোন: ${esc(me.phone)}</p><p>User Code: <b>${esc(me.code)}</b></p><button class="secondary" onclick="addFriend()">Friend যোগ করুন</button><button class="secondary" onclick="openAbout()">আমাকে কে বানিয়েছে?</button><button class="secondary" onclick="logout()">লগআউট</button>`);
}
function openAbout(){openModal('<h3>BD Islamic Messenger</h3><p>আমাকে হাফেজ মোহাম্মদ বাইজিদ হাসান বানিয়েছে। আমার মালিকের সাথে যোগাযোগ করতে পারেন: 01982641237</p>')}
function openModal(x){$('sheet').innerHTML=x;$('modal').classList.remove('hide')}
function closeModal(){$('modal').classList.add('hide')}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function logout(){token='';localStorage.removeItem('bdim_token');if(socket)socket.disconnect();closeModal();auth()}
if(token)start();else auth();
</script>
</body></html>
