<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BD Islamic Messenger</title><style>:root{--g:#075e3b;--g2:#0b7a4d;--m:#e9f7ef}*{box-sizing:border-box}body{margin:0;background:#f4faf6;color:#17352a;font-family:system-ui}.app{max-width:520px;margin:auto;height:100dvh;background:#fff;overflow:hidden}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;border-radius:0 0 24px 24px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:#fff2;display:grid;place-items:center;font-size:24px}.brand b{font-size:18px}.brand small{display:block;opacity:.8}.search{width:100%;margin-top:12px;padding:11px;border:1px solid #ffffff33;border-radius:14px;background:#ffffff18;color:#fff;outline:0}.search::placeholder{color:#d8eee3}main{height:calc(100dvh - 136px);overflow:auto;padding:12px 14px 80px}.stories{display:flex;gap:12px;overflow:auto;padding-bottom:12px}.story{min-width:65px;text-align:center;font-size:11px}.avatar{width:54px;height:54px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,#d9f2e2,#8ccda8);border:3px solid #d5eadc;font-weight:700;color:var(--g);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chat{display:flex;gap:12px;padding:12px 3px;border-bottom:1px solid #edf2ef}.chatbody{flex:1;min-width:0}.chatbody b{display:flex;justify-content:space-between}.muted{color:#789087;font-size:13px;margin-top:4px}.badge{background:var(--g2);color:#fff;border-radius:20px;padding:2px 7px;font-size:10px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:70px;background:#fff;border-top:1px solid #e8eee9;display:flex;justify-content:space-around;z-index:4}nav button{background:none;color:#819088;font-size:11px}nav .active{color:var(--g);font-weight:700}.ni{display:block;font-size:21px}.fab{position:fixed;right:max(calc((100vw - 520px)/2 + 18px),18px);bottom:82px;width:56px;height:56px;border:0;border-radius:19px;background:var(--g);color:#fff;font-size:27px}.view{display:none}.view.active{display:block}.card{border:1px solid #e4eee8;border-radius:20px;padding:16px;margin-bottom:12px}.primary{width:100%;padding:13px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;margin-top:12px}input{width:100%;padding:12px;border:1px solid #dbe7df;border-radius:13px;margin-top:6px}.row{padding:14px 2px;border-bottom:1px solid #edf2ef;display:flex;justify-content:space-between}.chatview{height:100dvh;background:#edf7f1}.chathead{background:var(--g);color:#fff;padding:12px;display:flex;align-items:center;gap:10px}.back{background:none;color:#fff;font-size:28px}.messages{height:calc(100dvh - 132px);overflow:auto;padding:14px}.bubble{max-width:78%;background:#fff;border-radius:15px;padding:9px 12px;margin:6px 0}.mine{margin-left:auto;background:#d8f1df}.composer{position:fixed;bottom:0;max-width:520px;width:100%;display:flex;gap:7px;padding:8px;background:#fff}.composer input{flex:1;margin:0}.send{width:44px;border:0;border-radius:13px;background:var(--g);color:#fff}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:18px}.close{float:right;border:0;background:#eef4f0;border-radius:10px;width:35px;height:35px}</style></head><body><div class="app"><header><div class="brand"><div class="logo">☪</div><div><b>BD Islamic Messenger</b><small>নিরাপদ • সহজ • ইসলামিক</small></div><button onclick="menu()" style="margin-left:auto;background:#ffffff18;color:white;border:0;border-radius:12px;width:40px;height:40px">⋮</button></div><input class="search" placeholder="নাম বা চ্যাট খুঁজুন..." oninput="render()"></header><main><section id="home" class="view active"><div class="stories"><div class="story" onclick="story()"><div class="avatar">＋</div>আপনার স্টোরি</div><div class="story"><div class="avatar">A</div>বন্ধু</div><div class="story"><div class="avatar">M</div>স্টোরি</div></div><b>চ্যাটস</b><div id="list"></div></section><section id="groups" class="view"><div class="card"><h2>👥 গ্রুপ</h2><p>গ্রুপ চ্যাটের জন্য প্রস্তুত জায়গা।</p><button class="primary">নতুন গ্রুপ</button></div></section><section id="status" class="view"><div class="card"><h2>◉ স্ট্যাটাস</h2><p>ছবি, ভিডিও ও লেখা স্টোরি এখানে থাকবে।</p><button class="primary" onclick="story()">স্টোরি যোগ করুন</button></div></section><section id="profile" class="view"><div class="card" style="text-align:center"><div class="avatar" style="width:105px;height:105px;font-size:40px">👤</div><h2 id="pname">আপনার প্রোফাইল</h2><p id="pphone" class="muted">ফোন</p><button class="primary" onclick="profile()">প্রোফাইল এডিট</button></div><div class="card"><div class="row">🔒 Privacy <span>›</span></div><div class="row">🔔 Notifications <span>›</span></div><div class="row">🚫 Blocked contacts <span>›</span></div><div class="row">ℹ️ About <span>›</span></div></div></section><section id="chat" class="view" style="padding:0"><div class="chatview"><div class="chathead"><button class="back" onclick="home()">‹</button><div class="avatar" style="width:42px;height:42px">F</div><b id="cname">Friend</b></div><div id="messages" class="messages"></div><div class="composer"><button onclick="document.getElementById('media').click()">＋</button><input id="msg" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button><input id="media" hidden type="file" accept="image/*,video/*" onchange="media(this.files[0])"></div></div></section></main><nav><button class="active" onclick="show('home',this)"><span class="ni">💬</span>Chats</button><button onclick="show('groups',this)"><span class="ni">👥</span>Groups</button><button onclick="show('status',this)"><span class="ni">◉</span>Status</button><button onclick="show('profile',this)"><span class="ni">👤</span>Profile</button></nav><button class="fab" onclick="add()">＋</button></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><div id="sheet"></div></div></div><script>let token=localStorage.getItem('bdim_token')||'',me=null,friends=[],active=null;const api=async(p,o={})=>{o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(p,o),j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Request failed');return j};function show(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b&&b.classList.add('active');document.querySelector('.fab').style.display=id==='home'?'block':'none'}function home(){show('home',document.querySelector('nav button'))}function openM(x){sheet.innerHTML=x;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}function add(){openM('<h2>বন্ধু যোগ করুন</h2><p>বন্ধুর ৪ সংখ্যার Secret Code দিন</p><input id="fc" inputmode="numeric" maxlength="4" placeholder="1234"><button class="primary" onclick="addFriend()">বন্ধু যোগ করুন</button>')}async function addFriend(){let c=fc.value.trim();if(!/^\d{4}$/.test(c))return alert('৪ সংখ্যার কোড দিন');try{let j=await api('/api/friends/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})});alert(j.message||'বন্ধু যোগ হয়েছে');closeM();load()}catch(e){alert(e.message)}}function menu(){openM('<h2>☪ Menu</h2><div class="row" onclick="profile()">👤 Profile</div><div class="row" onclick="add()">➕ Add friend</div><div class="row">⚙️ Settings</div><div class="row">🛡️ Privacy</div><div class="row">ℹ️ About</div><button class="primary" onclick="logout()">Logout</button>')}function profile(){openM('<h2>নিজের প্রোফাইল</h2><p>নাম</p><input id="pn"><p>Profile Photo</p><input id="pf" type="file" accept="image/*"><button class="primary" onclick="saveP()">Save Profile</button>')}async function saveP(){try{await api('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:pn.value})});closeM();boot()}catch(e){alert(e.message)}}function story(){openM('<h2>স্টোরি</h2><input type="file" accept="image/*,video/*"><p class="muted">স্টোরি ৭২ ঘণ্টা রাখার জন্য backend story API প্রয়োজন।</p>')}function logout(){localStorage.removeItem('bdim_token');location.reload()}async function load(){try{let j=await api('/api/friends');friends=j.friends||j||[];render()}catch(e){}}function render(){let q=document.querySelector('.search').value.toLowerCase();list.innerHTML=friends.filter(f=>(f.name||'').toLowerCase().includes(q)||(f.code||'').includes(q)).map(f=>'<div class="chat" onclick=chat('+JSON.stringify(f)+')><div class="avatar">'+((f.name||'F')[0])+'</div><div class="chatbody"><b>'+esc(f.name||'Friend')+' <span class="muted">আজ</span></b><div class="muted">চ্যাট শুরু করতে ট্যাপ করুন</div></div></div>').join('')||'<div class="card">কোনো বন্ধু নেই। ＋ চাপ দিয়ে ৪ সংখ্যার কোড দিন।</div>'}function chat(f){active=f;cname.textContent=f.name||'Friend';show('chat');loadMsg()}async function loadMsg(){try{let j=await api('/api/chats/'+encodeURIComponent(active.code)+'/messages');let a=j.messages||j||[];messages.innerHTML=a.map(m=>'<div class="bubble">'+esc(m.text||m.content||'')+'</div>').join('')}catch(e){}}async function send(){let t=msg.value.trim();if(!t||!active)return;try{await api('/api/chats/'+encodeURIComponent(active.code)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,content:t})});msg.value='';loadMsg()}catch(e){alert(e.message)}}async function media(f){if(!f)return;alert('Media upload backend বর্তমান সীমার ওপর নির্ভর করছে।')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function boot(){if(!token){return}try{me=await api('/api/me');pname.textContent=me.name||'আপনার প্রোফাইল';pphone.textContent=me.phone||'';await load()}catch(e){logout()}}boot();</script></body></html>
