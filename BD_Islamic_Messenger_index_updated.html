<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BD Islamic Messenger</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
:root{--green:#087f3d;--green2:#0a9b59;--soft:#eef8f2;--line:#e2eee6;--text:#12251b;--muted:#6d7c74}
body{margin:0;background:#edf5f0;color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #0001;position:relative}
.hide{display:none!important}.center{text-align:center}.muted{color:var(--muted);font-size:13px}
.top{height:72px;background:linear-gradient(135deg,#087f3d,#075f32);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:10}
.logo{width:48px;height:48px;border-radius:50%;background:#fff2;display:grid;place-items:center;font-size:28px;border:2px solid #ffffff55}
.top h2{margin:0;font-size:19px;flex:1}.top small{display:block;opacity:.82;font-size:11px;margin-top:2px}
.iconbtn{border:0;background:#ffffff18;color:#fff;border-radius:12px;width:42px;height:42px;font-size:22px}
.page{padding:14px 14px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #00000008}
.input{width:100%;padding:13px;border:1px solid #cbdcd1;border-radius:13px;margin:5px 0 10px;font-size:16px;outline:none}.input:focus{border-color:var(--green)}
.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--green);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.btn.alt{background:#e8f5ed;color:var(--green)}.btn.red{background:#c62828}
.row{display:flex;gap:8px}.row>*{flex:1}
.hero{text-align:center;padding:45px 18px 25px}.hero .mark{font-size:58px}.hero h1{margin:8px 0}.hero p{color:var(--muted)}
.search{background:#eff7f2;border:0!important;border-radius:24px;padding:14px 18px}
.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}
.chatrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}.chatrow:last-child{border-bottom:0}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#0a9b59,#087f3d);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.chatmain{min-width:0;flex:1}.chatname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-size:13px}.time{color:var(--muted);font-size:11px}.badge{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;border-radius:20px;background:var(--green2);color:#fff;font-size:11px;font-weight:800;margin-top:5px}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;height:68px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:9}.bottom button{flex:1;border:0;background:#fff;color:#718078;font-weight:700}.bottom button.active{color:var(--green)}.bottom .ico{display:block;font-size:23px;line-height:28px}
.fab{position:fixed;right:max(20px,calc((100vw - 620px)/2 + 20px));bottom:82px;width:58px;height:58px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:31px;box-shadow:0 7px 20px #0003;z-index:8}
.chat{height:calc(100vh - 72px);display:flex!important;flex-direction:column;padding:0!important}
.chathead{height:72px;background:linear-gradient(135deg,#087f3d,#075f32);color:#fff;display:flex;align-items:center;padding:8px 10px;gap:10px}
.chathead .back{border:0;background:transparent;color:#fff;font-size:28px}.chathead .info{flex:1}.chathead b{font-size:17px}.chathead small{display:block;opacity:.82;margin-top:2px}
.chatbody{flex:1;overflow:auto;padding:15px 12px 10px;background-color:#f2faf5;background-image:radial-gradient(#087f3d12 1px,transparent 1px);background-size:18px 18px}
.day{text-align:center;margin:5px auto 12px;background:#e0f0e6;color:#527063;width:max-content;padding:6px 13px;border-radius:18px;font-size:12px}
.bubble{max-width:78%;padding:10px 12px;border-radius:16px;margin:7px 0;word-wrap:break-word;box-shadow:0 1px 3px #0000000a}.me{margin-left:auto;background:#d8f3df;border-bottom-right-radius:4px}.them{background:#fff;border-bottom-left-radius:4px}.bubble img,.bubble video{max-width:100%;border-radius:11px;display:block;margin-bottom:5px}.small{font-size:10px;color:#718078;text-align:right;margin-top:4px}
.composer{display:flex;gap:6px;padding:9px;background:#fff;border-top:1px solid var(--line)}.composer input{margin:0}.composer .round{width:48px;padding:0}
.profile-big{width:100px;height:100px;border-radius:50%;overflow:hidden;background:#d9f0e3;color:var(--green);display:grid;place-items:center;font-size:40px;font-weight:800;margin:0 auto 10px}.profile-big img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:30}.sheet{background:#fff;width:100%;max-width:620px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}
.menuitem{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.menuitem:last-child{border:0}.menuitem b{flex:1}.menuicon{width:40px;height:40px;border-radius:12px;background:#e8f5ed;display:grid;place-items:center;font-size:20px;color:var(--green)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#123;color:#fff;padding:11px 15px;border-radius:12px;z-index:50;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal hide"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast hide"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('bdim_token')||'',me=null,friends=[],current=null,socket=null;
const accounts=()=>JSON.parse(localStorage.getItem('bdim_accounts')||'[]');
function saveAccount(u,t){let a=accounts().filter(x=>x.phone!==u.phone);a.unshift({name:u.name,phone:u.phone,code:u.code,token:t});localStorage.setItem('bdim_accounts',JSON.stringify(a).slice(0,30000))}
function avatarKey(code){return 'bdim_avatar_'+String(code||'')}
function getAvatar(code){return localStorage.getItem(avatarKey(code))||''}
function setAvatar(code,url){if(code&&url)localStorage.setItem(avatarKey(code),url)}
function chatKey(code){return 'bdim_last_'+String(me?.code||'')+'_'+String(code||'')}
function setLastChat(code,ts=Date.now()){if(code)localStorage.setItem(chatKey(code),String(ts))}
function lastChat(code){return Number(localStorage.getItem(chatKey(code))||0)}
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2200)}
async function api(url,opt={}){let h=opt.headers||{};if(!(opt.body instanceof FormData))h['Content-Type']='application/json';if(token)h.Authorization='Bearer '+token;let r=await fetch(url,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'সার্ভার সমস্যা');return d}
function friendAvatar(f,size=50){let av=f.avatarUrl||getAvatar(f.code);return av?`<div class="avatar" style="width:${size}px;height:${size}px"><img src="${esc(av)}"></div>`:`<div class="avatar" style="width:${size}px;height:${size}px">${esc((f.name||'?')[0])}</div>`}
function auth(){ $('app').innerHTML=`<div class="hero"><div class="mark">☪️</div><h1>BD Islamic Messenger</h1><p>ইসলামের পথে, সবার সাথে</p></div><div class="page"><div class="tabs"><button class="btn" onclick="showLogin()">লগইন</button><button class="btn alt" onclick="showRegister()">নতুন অ্যাকাউন্ট</button></div><div id="authbox" class="card"></div></div>`;showLogin()}
function showLogin(){ $('authbox').innerHTML=`<h3>লগইন করুন</h3><label>মোবাইল নম্বর</label><input id="phone" class="input" inputmode="tel" placeholder="01XXXXXXXXX"><label>৪ সংখ্যার Secret Code / PIN</label><input id="pin" class="input" inputmode="numeric" maxlength="4" placeholder="আপনার কোড"><button class="btn" style="width:100%" onclick="login()">লগইন করুন</button>`}
function showRegister(){ $('authbox').innerHTML=`<h3>নতুন অ্যাকাউন্ট</h3><label>First Name</label><input id="fname" class="input" placeholder="প্রথম নাম"><label>Last Name</label><input id="lname" class="input" placeholder="শেষ নাম"><label>Country</label><select id="country" class="input"><option value="+880">🇧🇩 Bangladesh (+880)</option><option value="+91">🇮🇳 India (+91)</option><option value="+92">🇵🇰 Pakistan (+92)</option><option value="+966">🇸🇦 Saudi Arabia (+966)</option><option value="+971">🇦🇪 UAE (+971)</option><option value="+44">🇬🇧 United Kingdom (+44)</option><option value="+1">🇺🇸 United States (+1)</option></select><label>মোবাইল নম্বর</label><input id="phone" class="input" inputmode="tel" placeholder="মোবাইল নম্বর"><label>নিজের ৪ সংখ্যার Secret Code</label><input id="pin" class="input" inputmode="numeric" maxlength="4" placeholder="যেমন 1234"><p class="muted">এই কোড মনে রাখবেন। এটিই আপনার অ্যাকাউন্টের পরিচয় ও লগইনের জন্য ব্যবহার হবে।</p><button class="btn" style="width:100%" onclick="register()">অ্যাকাউন্ট তৈরি করুন</button>`}
async function login(){try{let phone=$('phone').value.trim(),pin=$('pin').value.trim();if(!/^\\d{4}$/.test(pin))throw Error('৪ সংখ্যার কোড দিন');let d=await api('/api/login',{method:'POST',body:JSON.stringify({phone,pin})});token=d.token;me=d.user;localStorage.setItem('bdim_token',token);saveAccount(me,token);await start()}catch(e){toast(e.message)}}
async function register(){try{let name=[$('fname').value.trim(),$('lname').value.trim()].filter(Boolean).join(' '),phone=$('phone').value.trim(),pin=$('pin').value.trim(),country=$('country').value;if(!name||!phone||!/^[0-9]{4}$/.test(pin))throw Error('নাম, ফোন ও ৪ সংখ্যার কোড দিন');let d=await api('/api/register',{method:'POST',body:JSON.stringify({name,country,phone,pin})});token=d.token;me=d.user;localStorage.setItem('bdim_token',token);saveAccount(me,token);await start()}catch(e){toast(e.message)}}
async function start(){try{me=await api('/api/me');friends=(await api('/api/friends')).map(x=>({...x,avatarUrl:x.avatarUrl||getAvatar(x.code)}));home();connect()}catch(e){token='';localStorage.removeItem('bdim_token');auth()}}
function shellHome(){return `<div class="top"><div class="logo">☪️</div><div style="flex:1"><h2>BD Islamic Messenger</h2><small>ইসলামের পথে, সবার সাথে</small></div><button class="iconbtn" onclick="searchPrompt()">⌕</button><button class="iconbtn" onclick="menu()">⋮</button></div><div id="content" class="page"></div>`}
function home(){current=null;$('app').innerHTML=shellHome();renderHome()}
function sortedFriends(){return [...friends].sort((a,b)=>lastChat(b.code)-lastChat(a.code)||Number(b.unread)-Number(a.unread)||String(a.name).localeCompare(String(b.name),'bn'))}
function renderHome(){let list=sortedFriends();$('content').innerHTML=`<div><input id="chatSearch" class="input search" placeholder="চ্যাট, গ্রুপ বা কন্টাক্ট খুঁজুন..." oninput="filterChats(this.value)"></div><div class="tabs"><button class="btn" >💬 সবগুলো</button><button class="btn alt">👤 ব্যক্তিগত</button><button class="btn alt">👥 গ্রুপ</button><button class="btn alt">📢 চ্যানেল</button></div><div class="card" style="padding:4px 12px"><div id="flist">${chatRows(list)}</div></div><div class="bottom"><button class="active" onclick="home()"><span class="ico">💬</span>Chats</button><button onclick="friendsPage()"><span class="ico">👥</span>Friends</button><button onclick="statusPage()"><span class="ico">◉</span>Status</button><button onclick="profile()"><span class="ico">👤</span>Profile</button></div>`;let fab=document.createElement('button');fab.className='fab';fab.textContent='+';fab.onclick=addFriend;$('app').appendChild(fab)}
function chatRows(list){if(!list.length)return '<p class="muted center" style="padding:30px 10px">এখনও কোনো Friend নেই। + চাপ দিয়ে Friend যোগ করুন।</p>';return list.map(f=>`<div class="chatrow" data-name="${esc(f.name).toLowerCase()}" onclick="openChat('${esc(f.code)}')">${friendAvatar(f)}<div class="chatmain"><div class="chatname">${esc(f.name)}</div><div class="preview">${f.unread?'● নতুন মেসেজ':'অনলাইনে কথা বলুন'}</div></div><div style="text-align:right"><div class="time">${lastChat(f.code)?new Date(lastChat(f.code)).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'}):''}</div>${f.unread?'<div class="badge">নতুন</div>':''}</div></div>`).join('')}
function filterChats(q){q=q.trim().toLowerCase();document.querySelectorAll('.chatrow').forEach(x=>x.style.display=(!q||x.dataset.name.includes(q))?'flex':'none')}
function searchPrompt(){let q=prompt('Friend-এর নাম বা User Code লিখুন');if(!q)return;let f=friends.find(x=>String(x.code)===String(q)||String(x.name).toLowerCase().includes(q.toLowerCase()));if(f)openChat(f.code);else toast('Friend পাওয়া যায়নি')}
async function addFriend(){let code=prompt('বন্ধুর ৪ সংখ্যার Secret Code দিন');if(!code)return;try{let d=await api('/api/friends/add',{method:'POST',body:JSON.stringify({code})});friends=(await api('/api/friends')).map(x=>({...x,avatarUrl:x.avatarUrl||getAvatar(x.code)}));toast(d.user.name+' Friend হিসেবে যোগ হয়েছে');renderHome()}catch(e){toast(e.message)}}
async function openChat(code){current=friends.find(x=>String(x.code)===String(code));if(!current)return;setLastChat(code);$('app').innerHTML=`<div class="chat"><div class="chathead"><button class="back" onclick="home()">‹</button>${friendAvatar(current,48)}<div class="info"><b>${esc(current.name)}</b><small>${current.online?'অনলাইন':'অফলাইন'} · Code: ${esc(current.code)}</small></div><button class="iconbtn" onclick="toast('অডিও কল শিগগিরই যোগ হবে')">☎</button><button class="iconbtn" onclick="toast('ভিডিও কল শিগগিরই যোগ হবে')">▣</button><button class="iconbtn" onclick="friendProfile()">⋮</button></div><div id="msgs" class="chatbody">লোড হচ্ছে...</div><div class="composer"><input id="msg" class="input" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key==='Enter')sendText()"><button class="btn alt round" onclick="pickMedia()">📎</button><button class="btn round" onclick="sendText()">➤</button><input id="file" type="file" accept="image/*,video/*" hidden onchange="sendMedia()"></div></div>`;await loadMessages();await api('/api/chats/'+encodeURIComponent(code)+'/read',{method:'POST'}).catch(()=>{});friends=friends.map(f=>f.code===code?{...f,unread:false}:f)}
async function loadMessages(){try{let d=await api('/api/chats/'+encodeURIComponent(current.code)+'/messages');renderMessages(Array.isArray(d)?d:(d.messages||[]))}catch(e){toast(e.message)}}
function renderMessages(arr){let el=$('msgs');if(!el)return;let firstMine=arr.find(m=>String(m.senderCode)===String(me.code));el.innerHTML='<div class="day">আজ</div>'+arr.map((m,i)=>{let mine=String(m.senderCode)===String(me.code);let media=m.type==='image'?`<img src="${esc(m.mediaUrl)}" loading="lazy">`:m.type==='video'?`<video src="${esc(m.mediaUrl)}" controls preload="metadata"></video>`:'';let first=firstMine&&m.id===firstMine.id;return `<div class="bubble ${mine?'me':'them'}" ${first?'style="border:2px solid #6acb8b"':''}>${media}${m.body?`<div style="${first?'font-weight:800':''}">${esc(m.body)}</div>`:''}<div class="small">${new Date(m.createdAt).toLocaleString('bn-BD')} ${mine?(m.seen?'✓✓':'✓'):''}</div></div>`}).join('');el.scrollTop=el.scrollHeight}
async function sendText(){let v=$('msg').value.trim();if(!v||!current)return;try{await api('/api/chats/'+encodeURIComponent(current.code)+'/messages',{method:'POST',body:JSON.stringify({type:'text',body:v})});$('msg').value='';setLastChat(current.code);await loadMessages()}catch(e){toast(e.message)}}
function pickMedia(){$('file').click()}
async function sendMedia(){let f=$('file').files[0];if(!f)return;if(f.size>50*1024*1024){toast('ফাইল ৫০ MB-এর মধ্যে রাখুন');return}try{let fd=new FormData();fd.append('file',f);let up=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+encodeURIComponent(current.code)+'/messages',{method:'POST',body:JSON.stringify({type:up.type,mediaUrl:up.url})});setLastChat(current.code);await loadMessages()}catch(e){toast(e.message)}$('file').value=''}
function profile(){let av=me.avatarUrl||getAvatar(me.code);openSheet(`<h2 class="center">আমার প্রোফাইল</h2>${av?`<div class="profile-big"><img src="${esc(av)}"></div>`:`<div class="profile-big">${esc((me.name||'B')[0])}</div>`}<div class="card center"><h3>${esc(me.name)}</h3><p>ফোন: ${esc(me.phone)}</p><p>Secret Code: <b>${esc(me.code)}</b></p></div><div class="card"><div class="menuitem"><div class="menuicon">👤</div><b>নতুন অ্যাকাউন্ট রেজিস্টার করুন</b></div><div class="menuitem" onclick="accountsMenu()"><div class="menuicon">🔐</div><b>এই PIN/Code দিয়ে অ্যাকাউন্ট লগইন করুন</b></div><div class="menuitem" onclick="addFriend()"><div class="menuicon">➕</div><b>Friend যোগ করুন</b></div></div><div class="card"><h3>BD Islamic Messenger-এর প্রতিষ্ঠাতা ও নির্মাতা</h3><h2 style="color:var(--green)">হাফেজ মোহাম্মদ বায়জিদ</h2><p class="muted">এই অ্যাপটি হাফেজ মোহাম্মদ বায়জিদ কর্তৃক তৈরি ও পরিচালিত।</p><p><b>যোগাযোগ: 01982641237</b></p></div><input id="profileFile" type="file" accept="image/*" onchange="uploadProfilePhoto()"><button class="btn red" style="width:100%;margin-top:10px" onclick="logout()">লগআউট</button><button class="btn alt" style="width:100%;margin-top:8px" onclick="closeModal()">বন্ধ করুন</button>`)}
async function uploadProfilePhoto(){let f=$('profileFile')?.files?.[0];if(!f)return;try{let fd=new FormData();fd.append('file',f);let up=await api('/api/upload',{method:'POST',body:fd});me=await api('/api/profile',{method:'PUT',body:JSON.stringify({avatarUrl:up.url,name:me.name})});setAvatar(me.code,up.url);saveAccount(me,token);toast('প্রোফাইল ছবি আপডেট হয়েছে');closeModal();home()}catch(e){toast(e.message)}}
function friendProfile(){if(!current)return;let av=current.avatarUrl||getAvatar(current.code);openSheet(`<h2 class="center">${esc(current.name)}</h2>${av?`<div class="profile-big"><img src="${esc(av)}"></div>`:`<div class="profile-big">${esc((current.name||'?')[0])}</div>`}<div class="card center"><p>Secret Code: <b>${esc(current.code)}</b></p><p>${current.online?'অনলাইন':'অফলাইন'}</p></div><button class="btn red" style="width:100%" onclick="blockFriend()">🚫 Block</button><button class="btn alt" style="width:100%;margin-top:8px" onclick="unblockFriend()">↩️ Unblock</button><button class="btn alt" style="width:100%;margin-top:8px" onclick="closeModal()">বন্ধ করুন</button>`)}
async function blockFriend(){try{await api('/api/block/'+encodeURIComponent(current.code),{method:'POST'});toast('Friend Block করা হয়েছে');closeModal()}catch(e){toast(e.message)}}
async function unblockFriend(){try{await api('/api/block/'+encodeURIComponent(current.code),{method:'DELETE'});toast('Friend Unblock করা হয়েছে');closeModal()}catch(e){toast(e.message)}}
function menu(){openSheet(`<h2>☰ Menu</h2><div class="menuitem" onclick="home();closeModal()"><div class="menuicon">🏠</div><b>Home</b><span>›</span></div><div class="menuitem" onclick="addFriend();closeModal()"><div class="menuicon">➕</div><b>Friend যোগ করুন</b><span>›</span></div><div class="menuitem" onclick="accountsMenu()"><div class="menuicon">👥</div><b>Account Switch</b><span>›</span></div><div class="menuitem" onclick="profile()"><div class="menuicon">👤</div><b>আমার Profile</b><span>›</span></div><div class="menuitem" onclick="settingsPage()"><div class="menuicon">⚙️</div><b>Settings</b><span>›</span></div><div class="card"><b>BD Islamic Messenger</b><p class="muted">প্রতিষ্ঠাতা ও নির্মাতা: হাফেজ মোহাম্মদ বায়জিদ</p><p><b>যোগাযোগ: 01982641237</b></p></div>`)}
function accountsMenu(){let a=accounts();openSheet(`<h2>Saved Accounts</h2>${a.length?a.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.code)}</div><button class="btn" style="margin-top:8px" onclick="switchAccount(${i})">এই অ্যাকাউন্টে ঢুকুন</button></div>`).join(''):'<p class="muted">কোনো Saved Account নেই।'}<button class="btn alt" style="width:100%" onclick="closeModal()">বন্ধ করুন</button>`)}
async function switchAccount(i){let a=accounts()[i];if(!a)return;token=a.token;localStorage.setItem('bdim_token',token);closeModal();await start()}
function settingsPage(){openSheet(`<h2>Settings</h2><div class="menuitem"><div class="menuicon">🔒</div><b>Privacy & Security</b></div><div class="menuitem"><div class="menuicon">🔔</div><b>Notifications</b></div><div class="menuitem"><div class="menuicon">🎨</div><b>Appearance</b></div><div class="menuitem"><div class="menuicon">💬</div><b>Chats</b></div><div class="menuitem"><div class="menuicon">👥</div><b>Friends</b></div><button class="btn alt" style="width:100%;margin-top:12px" onclick="closeModal()">বন্ধ করুন</button>`)}
function friendsPage(){openSheet(`<h2>আমার Friends</h2>${sortedFriends().map(f=>`<div class="chatrow" onclick="closeModal();openChat('${esc(f.code)}')">${friendAvatar(f)}<div class="chatmain"><div class="chatname">${esc(f.name)}</div><div class="preview">Code: ${esc(f.code)}</div></div></div>`).join('')||'<p class="muted">কোনো Friend নেই।'}<button class="btn" style="width:100%;margin-top:12px" onclick="addFriend();closeModal()">＋ Friend যোগ করুন</button>`)}
function statusPage(){openSheet(`<h2>স্টোরি</h2><div class="card center"><div style="font-size:50px">◉</div><h3>আপনার স্টোরি</h3><p class="muted">ছবি বা শর্ট ভিডিও দিয়ে স্টোরি দিতে পারবেন। স্টোরি ৭২ ঘণ্টা পরে অটোমেটিক মুছে যাবে।</p><button class="btn" onclick="toast('স্টোরি ফিচার পরের ধাপে সক্রিয় করা হবে')">＋ Story যোগ করুন</button></div><button class="btn alt" style="width:100%" onclick="closeModal()">বন্ধ করুন</button>`)}
function openSheet(html){$('modal').classList.remove('hide');$('sheet').innerHTML=html}
function closeModal(){$('modal').classList.add('hide')}
function logout(){token='';me=null;localStorage.removeItem('bdim_token');if(socket)socket.disconnect();closeModal();auth()}
function connect(){if(socket)socket.disconnect();socket=io({auth:{token}});socket.on('message:new',m=>{setLastChat(m.senderCode);if(current&&String(m.senderCode)===String(current.code)){loadMessages();api('/api/chats/'+encodeURIComponent(current.code)+'/read',{method:'POST'}).catch(()=>{})}else{friends=friends.map(f=>String(f.code)===String(m.senderCode)?{...f,unread:true}:f);if($('flist'))renderHome()}});socket.on('message:sent',m=>{setLastChat(m.receiverCode||current?.code);if(current&&String(m.senderCode)===String(me.code))loadMessages();else if($('flist'))renderHome()});socket.on('presence',p=>{let f=friends.find(x=>x.id===p.userId);if(f){f.online=p.online;if($('flist'))renderHome()}})}
window.addEventListener('popstate',()=>home());
(async()=>{if(token)await start();else auth()})();
</script>
</body>
</html>
